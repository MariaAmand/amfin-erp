<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP Financeiro</title>
<style>
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#1a2320; --muted:#5d6a65; --line:#dde2dc; --line2:#eceee9;
  --side:#14302a; --side-ink:#d6e4de; --side-mut:#8fb0a4; --side-on:#1f4a40;
  --accent:#1d6b57; --accent-ink:#ffffff; --accent-soft:#e0f0ea;
  --pos:#17703f; --neg:#b3261e; --warn:#8a5a00; --pos-bg:#e3f3e8; --neg-bg:#fbe7e5; --warn-bg:#fdf1d6; --info-bg:#e5eef7; --info:#1c4f8a;
  --shadow:0 1px 2px rgba(20,40,34,.06),0 4px 14px rgba(20,40,34,.06);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1714; --surface:#17211e; --ink:#e4ece8; --muted:#97a8a1; --line:#2a3833; --line2:#212d29;
  --side:#0a1210; --side-ink:#cfe0d9; --side-mut:#7d9a8f; --side-on:#183a32;
  --accent:#4fb596; --accent-ink:#062018; --accent-soft:#1a3a31;
  --pos:#5fcf8c; --neg:#ff8f87; --warn:#f0c15a; --pos-bg:#173326; --neg-bg:#3a1f1d; --warn-bg:#3b2f12; --info-bg:#172b44; --info:#8db9ee;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:1.45rem;letter-spacing:-.01em} h2{font-size:1.05rem} h3{font-size:.95rem}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:16px 10px 24px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:4px 10px 14px;font-weight:700;font-size:1.05rem;letter-spacing:.01em}
.brand small{display:block;font-weight:400;color:var(--side-mut);font-size:.75rem;margin-top:2px}
.navg{margin:14px 10px 4px;font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--side-mut)}
.nav a{display:block;padding:7px 10px;border-radius:6px;color:var(--side-ink);text-decoration:none}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:var(--side-on);color:#fff;font-weight:600}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top .who{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.menu-btn{display:none}
.content{padding:22px 24px 48px;max-width:1280px;width:100%}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pagehead p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.card>h2{margin-bottom:10px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .l{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:1.35rem;font-weight:650;margin-top:2px;overflow-wrap:break-word}
.kpi .s{font-size:.78rem;color:var(--muted);margin-top:2px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)} .mut{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:7px;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.dng{color:var(--neg);border-color:var(--neg)}
.btn.sm{padding:3px 8px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;background:var(--surface)}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg);position:sticky;top:0;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
td.ctr,th.ctr{text-align:center}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:700;background:var(--bg)}
tr.dest td{font-weight:700;background:var(--accent-soft)}
tr.sint td{font-weight:600}
tr.bad td{background:var(--neg-bg)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.74rem;font-weight:600;background:var(--line2);color:var(--muted);white-space:nowrap}
.pill.ok,.pill.aprovado,.pill.pago,.pill.ativa,.pill.favoravel,.pill.A{background:var(--pos-bg);color:var(--pos)}
.pill.pendente,.pill.alerta,.pill.aberto,.pill.condicionado,.pill.B{background:var(--info-bg);color:var(--info)}
.pill.bloqueado,.pill.rejeitado,.pill.excedido,.pill.desfavoravel,.pill.D,.pill.reprovado,.pill.inativa{background:var(--neg-bg);color:var(--neg)}
.pill.cancelado,.pill.sem_orcamento,.pill.C{background:var(--warn-bg);color:var(--warn)}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:3px}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
input[type=checkbox]{width:auto}
.field.check{display:flex;gap:8px;align-items:center}
.field.check label{margin:0;color:var(--ink);font-size:.9rem}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filters>div{min-width:130px;flex:0 1 170px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.form .full{grid-column:1/-1}
.hint{font-size:.76rem;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--accent);border-color:var(--accent);font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(8,16,13,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{max-width:860px}
.modal header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .mb{padding:16px 18px}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.err{background:var(--neg-bg);color:var(--neg);padding:8px 10px;border-radius:6px;margin-bottom:10px;font-size:.88rem}
.note{background:var(--info-bg);color:var(--info);padding:9px 12px;border-radius:8px;margin-bottom:12px;font-size:.88rem}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--neg-bg);color:var(--neg)}
.note.good{background:var(--pos-bg);color:var(--pos)}
#toasts{pointer-events:none;position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);max-width:360px}
.toast.bad{background:var(--neg);color:#fff}
.empty{padding:28px;text-align:center;color:var(--muted)}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login .box{width:100%;max-width:380px}
.login h1{margin-bottom:4px}
.bars{display:flex;gap:10px;align-items:flex-end;height:170px;padding:8px 4px 0;overflow-x:auto}
.bars .g{flex:1 0 56px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .pair{display:flex;gap:3px;align-items:flex-end;height:120px;width:100%;justify-content:center}
.bars .b{width:40%;max-width:22px;border-radius:3px 3px 0 0;min-height:1px}
.bars .b.e{background:var(--pos)} .bars .b.s{background:var(--neg)}
.bars .lb{font-size:.7rem;color:var(--muted);white-space:nowrap}
.bars .sd{font-size:.7rem;font-weight:600;white-space:nowrap}
.meter{height:8px;background:var(--line2);border-radius:99px;overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.bad i{background:var(--neg)} .meter.warn i{background:var(--warn)}
.indent1{padding-left:18px!important}.indent2{padding-left:36px!important}.indent3{padding-left:54px!important}.indent4{padding-left:72px!important}
.eqn{font-family:var(--mono);font-size:.85rem;background:var(--bg);padding:8px 10px;border-radius:6px;overflow-x:auto}
details>summary{cursor:pointer;color:var(--accent)}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:40;transform:translateX(-105%);transition:transform .18s}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  .content{padding:16px 14px 40px}.top{padding:10px 14px}
  .kpi .v{font-size:1.1rem}
  .form{grid-template-columns:1fr}
}
@media print{.side,.top,.no-print,#toasts{display:none!important}.shell{display:block}.content{padding:0;max-width:none}.card{box-shadow:none;border:0}}

</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<script>
const Engine = (function(){
'use strict';
/* ===== Motor local do ERP (substitui o servidor): dados no navegador, mesmas regras de negócio ===== */
class ApiError extends Error { constructor(status, msg, extra) { super(msg); this.status = status; this.msg = msg; this.extra = extra || {}; } }
const TABELAS = ['empresas', 'usuarios', 'sessoes', 'contas', 'lancamentos', 'lanc_itens', 'parceiros', 'contas_fin', 'titulos', 'movimentos', 'orcamentos', 'analises_credito', 'acoes_cobranca', 'aplicacoes', 'resgates', 'produtos', 'auditoria'];
const LSKEY = 'erp_financeiro_dados_v1';
const novoDB = () => { const d = { seq: {} }; TABELAS.forEach(t => { d[t] = []; d.seq[t] = 0; }); return d; };
let DB = novoDB();
let memStore = null;
function carregar() { try { const s = localStorage.getItem(LSKEY); if (s) { DB = JSON.parse(s); TABELAS.forEach(t => { DB[t] = DB[t] || []; DB.seq[t] = DB.seq[t] || 0; }); return; } } catch (e) { } if (memStore) DB = JSON.parse(memStore); }
function salvar() { const s = JSON.stringify(DB); memStore = s; try { localStorage.setItem(LSKEY, s); } catch (e) { engineAviso = 'Não foi possível gravar no navegador (armazenamento cheio ou bloqueado). Faça um backup.'; } }
let engineAviso = '';
const ins = (t, o) => { o.id = ++DB.seq[t]; DB[t].push(o); return o; };
const doc = (t, id) => DB[t].find(r => r.id === id);
const lista = (t, f) => DB[t].filter(f || (() => true));
const rm = (t, f) => { DB[t] = DB[t].filter(r => !f(r)); };
const clone = o => JSON.parse(JSON.stringify(o));

// ───── datas e dinheiro (datas são textos AAAA-MM-DD) ─────
const p2 = n => String(n).padStart(2, '0');
const isoDe = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const hoje = () => isoDe(new Date());
const agoraISO = () => { const d = new Date(); return `${isoDe(d)} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`; };
const umDia = 86400000;
const toD = iso => new Date(iso + 'T12:00:00');
const somaDias = (iso, n) => isoDe(new Date(toD(iso).getTime() + n * umDia));
const difDias = (a, b) => Math.round((toD(a) - toD(b)) / umDia);
function somaMeses(iso, n) {
  const [y, m, d] = iso.split('-').map(Number); const t = m - 1 + n; const ny = y + Math.floor(t / 12), nm = ((t % 12) + 12) % 12 + 1;
  const ult = new Date(ny, nm, 0).getDate(); return `${ny}-${p2(nm)}-${p2(Math.min(d, ult))}`;
}
const reais = c => Math.round(c || 0) / 100;
const arred = (v, d = 2) => { const f = 10 ** d; return Math.round((v + Number.EPSILON) * f) / f; };
const mesDe = iso => iso.slice(0, 7);

// ───── validação de entrada ─────
function txt(d, k, obrig = true, mx = 200, rotulo) {
  let v = d[k];
  if (v === undefined || v === null || (typeof v === 'string' && !v.trim())) { if (obrig) throw new ApiError(400, `Informe ${rotulo || k}.`); return null; }
  if (typeof v === 'boolean' || (typeof v !== 'string' && typeof v !== 'number')) throw new ApiError(400, `Valor inválido em ${rotulo || k}.`);
  v = String(v).trim(); if (v.length > mx) throw new ApiError(400, `${rotulo || k} excede ${mx} caracteres.`); return v;
}
function inteiro(d, k, obrig = true, rotulo, minimo, maximo, padrao) {
  const v = d[k];
  if (v === undefined || v === null || v === '') { if (padrao !== undefined) return padrao; if (obrig) throw new ApiError(400, `Informe ${rotulo || k}.`); return null; }
  if (typeof v === 'boolean' || !/^-?\d+$/.test(String(v).trim())) throw new ApiError(400, `${rotulo || k} deve ser um número inteiro.`);
  const n = parseInt(v, 10); if ((minimo != null && n < minimo) || (maximo != null && n > maximo)) throw new ApiError(400, `${rotulo || k} fora do intervalo permitido.`); return n;
}
function numero(d, k, obrig = true, rotulo, minimo, maximo, padrao) {
  const v = d[k];
  if (v === undefined || v === null || v === '') { if (padrao !== undefined) return padrao; if (obrig) throw new ApiError(400, `Informe ${rotulo || k}.`); return null; }
  const s = String(v).replace(',', '.').trim(); const n = Number(s);
  if (typeof v === 'boolean' || s === '' || !Number.isFinite(n)) throw new ApiError(400, `${rotulo || k} deve ser numérico.`);
  if ((minimo != null && n < minimo) || (maximo != null && n > maximo)) throw new ApiError(400, `${rotulo || k} fora do intervalo permitido.`); return n;
}
const flag = (d, k, padrao = 0) => { const v = d[k]; if (v === undefined || v === null) return padrao; return [true, 1, '1', 'true', 'on', 'sim'].includes(v) ? 1 : 0; };
function paraCentavos(s) { // texto em reais -> centavos, arredondamento comercial (meio para cima), sem erro de ponto flutuante
  s = String(s).trim(); if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.'); else if (s.includes(',')) s = s.replace(',', '.');
  const m = /^(-?)(\d*)(?:\.(\d*))?$/.exec(s); if (!m || (m[2] === '' && !m[3])) return NaN;
  const frac = (m[3] || '').padEnd(3, '0'); let c = parseInt(m[2] || '0', 10) * 100 + parseInt(frac.slice(0, 2), 10); if (parseInt(frac[2], 10) >= 5) c += 1; return m[1] ? -c : c;
}
function dinheiro(d, k, obrig = true, rotulo, zero = false, padrao) {
  const v = d[k];
  if (v === undefined || v === null || v === '') { if (padrao !== undefined) return padrao; if (obrig) throw new ApiError(400, `Informe ${rotulo || k}.`); return null; }
  if (typeof v === 'boolean') throw new ApiError(400, `Valor inválido em ${rotulo || k}.`);
  const c = paraCentavos(v); if (Number.isNaN(c)) throw new ApiError(400, `${rotulo || k} deve ser um valor monetário.`);
  if (c < 0 || (c === 0 && !zero)) throw new ApiError(400, zero ? `${rotulo || k} não pode ser negativo.` : `${rotulo || k} deve ser maior que zero.`);
  if (c > 1e14) throw new ApiError(400, `${rotulo || k} acima do limite permitido.`); return c;
}
function parseData(v, rotulo = 'data') {
  const s = String(v); const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); const d = m && new Date(+m[1], +m[2] - 1, +m[3]);
  if (!m || d.getFullYear() !== +m[1] || d.getMonth() !== +m[2] - 1 || d.getDate() !== +m[3]) throw new ApiError(400, `${rotulo} inválida (use AAAA-MM-DD).`); return s;
}
function data(d, k, obrig = true, rotulo, padrao) {
  const v = d[k]; if (v === undefined || v === null || v === '') { if (padrao !== undefined) return padrao; if (obrig) throw new ApiError(400, `Informe ${rotulo || k}.`); return null; } return parseData(v, rotulo || k);
}
function escolha(d, k, opcoes, rotulo, obrig = true, padrao) {
  const v = txt(d, k, obrig && padrao === undefined, 200, rotulo); if (v === null) return padrao; if (!opcoes.includes(v)) throw new ApiError(400, `${rotulo || k} inválido(a).`); return v;
}
function validarSenha(s, rotulo = 'A senha') { if (typeof s !== 'string' || s.length < 6) throw new ApiError(400, `${rotulo} deve ter no mínimo 6 caracteres.`); if (s.length > 128) throw new ApiError(400, `${rotulo} muito longa.`); }

// ───── senhas (PBKDF2-SHA256 do navegador) ─────
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const unhex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
async function pbkdf2(senha, saltHex, it) {
  if (!crypto || !crypto.subtle) throw new ApiError(500, 'Este navegador não oferece criptografia segura. Abra o ERP por https:// ou use um navegador atual.');
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveBits']);
  return hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unhex(saltHex), iterations: it }, key, 256));
}
const aleatorioHex = n => hex(crypto.getRandomValues(new Uint8Array(n)));
async function hashSenha(s) { const salt = aleatorioHex(16), it = 120000; return `pbkdf2$${it}$${salt}$${await pbkdf2(s, salt, it)}`; }
async function checkSenha(s, h) { const [, it, salt, hx] = h.split('$'); const calc = await pbkdf2(s, salt, +it); let r = 0; for (let i = 0; i < calc.length; i++) r |= calc.charCodeAt(i) ^ hx.charCodeAt(i); return r === 0 && calc.length === hx.length; }

// ───── contexto, permissões e roteador ─────
class Ctx {
  constructor(user, empresa, body, q) { this.user = user; this.empresa = empresa; this.body = body || {}; this.q = q || {}; }
  get eid() { if (!this.empresa) throw new ApiError(400, 'Selecione uma empresa.'); return this.empresa.id; }
  pode(perm) {
    const u = this.user; if (u.papel === 'master') return true;
    if (perm === 'cadastro') return u.papel === 'admin' && !!(this.empresa && this.empresa.admin_pode_cadastrar);
    if (u.papel === 'admin') return ['ver', 'lancar', 'aprovar'].includes(perm);
    return !!u['p_' + perm];
  }
  exigir(perm) {
    if (this.pode(perm)) return;
    const m = { cadastro: 'Cadastros não liberados para o seu acesso nesta empresa. Solicite ao master.', lancar: 'Você não tem permissão para lançar.', aprovar: 'Você não tem permissão para aprovar.', ver: 'Você não tem permissão para visualizar.' };
    throw new ApiError(403, m[perm] || 'Acesso negado.');
  }
  auditar(acao, detalhe = '', empresaId) { ins('auditoria', { empresa_id: empresaId !== undefined ? empresaId : (this.empresa ? this.empresa.id : null), usuario_id: this.user.id, usuario_nome: this.user.login, acao, detalhe, ts: agoraISO() }); }
  achar(t, id, msg = 'Registro não encontrado.') { const r = DB[t].find(x => x.id === id && x.empresa_id === this.eid); if (!r) throw new ApiError(404, msg); return r; }
}
const ROTAS = [];
const rota = (metodo, padrao, perm = 'ver', empresa = true) => fn => { ROTAS.push([metodo, new RegExp('^' + padrao + '$'), perm, empresa, fn]); };
const LIVRES_TROCA = new Set(['/api/me', '/api/senha', '/api/logout']);
let tokenMem = null;
const getToken = () => { try { return sessionStorage.getItem('erp_sid') || tokenMem; } catch (e) { return tokenMem; } };
const setToken = t => { tokenMem = t; try { t ? sessionStorage.setItem('erp_sid', t) : sessionStorage.removeItem('erp_sid'); } catch (e) { } };

async function handle(metodo, caminho, q = {}, corpo = {}, empresaHdr = null) {

    const snap = metodo !== 'GET' ? JSON.stringify(DB) : null;
    try {

      }

      if (perm === 'master' && user.papel !== 'master') throw new ApiError(403, 'Apenas o master pode realizar esta ação.');
      if (['ver', 'lancar', 'aprovar', 'cadastro'].includes(perm)) { if (!empresa) throw new ApiError(400, 'Selecione uma empresa.'); ctx.exigir(perm); }
      else if (precisaEmp && !empresa) throw new ApiError(400, 'Selecione uma empresa.');
      const r = await fn(ctx, ...mt.slice(1));
      if (metodo !== 'GET') salvar();
      return r === undefined ? {} : clone(r);
    } catch (e) {
      if (snap) { DB = JSON.parse(snap); }
      if (e instanceof ApiError) { const er = new Error(e.msg); er.status = e.status; er.data = { erro: e.msg, ...e.extra }; throw er; }

}

// delegação de eventos de ações: <button data-a="nome" data-id="1">
const ACOES = {};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const f = ACOES[t.dataset.a]; if (!f) return;
  e.preventDefault(); Promise.resolve(f(t.dataset, t)).catch(err => toast(err.message, true));
});
E.f = {};
document.addEventListener('submit', e => {
  if (e.target.matches('[data-filtro]')) {
    e.preventDefault(); const id = location.hash.replace(/^#\//, '').split('?')[0]; const r = E.porId[id];
    if (r && r.campos) { E.f[id] = lerFiltros($('#view'), r.campos); recarregar(); }
  }
});
const filtroDe = id => E.f[id] || {};
const btn = (a, id, label, cls = '', extra = {}) => html`<button type="button" class="btn sm ${cls}" data-a="${a}" data-id="${id}" ${raw(Object.entries(extra).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' '))}>${label}</button>`;

</script>
<script>
'use strict';
/* Login, estrutura do app, empresas/acessos (master e admin), configuração, painel e aprovações. */

function telaLogin(msg) {
  mount($('#app'), html`<div class="login"><form class="card box" id="lf" novalidate>
    <h1>ERP Financeiro</h1><p class="mut" style="margin:4px 0 14px">Gestão financeira empresarial: contabilidade, caixa, orçamento, crédito, investimentos e custos.</p>
    ${msg ? nota(msg, 'warn') : ''}<div class="err" id="lerr" hidden></div>
    <div class="field">${campo({ n: 'login', l: 'Login', req: 1 })}</div><div style="height:10px"></div>
    <div class="field"><label for="f_senha">Senha *</label><input id="f_senha" name="senha" type="password" autocomplete="current-password"></div>
    <div style="height:14px"></div><button class="btn pri" style="width:100%;justify-content:center" type="submit">Entrar</button>
    <p class="hint" style="margin-top:12px">Os acessos são criados pelo master da plataforma, que repassa login e senha à empresa.</p></form></div>`);
  $('#lf').addEventListener('submit', async e => {
    e.preventDefault(); const er = $('#lerr'); er.hidden = true;
    try {
      E.me = await post('/api/login', { login: $('#f_login').value.trim(), senha: $('#f_senha').value });
      await iniciarSessao();
    } catch (x) { er.textContent = x.message; er.hidden = false; }
  });
  $('#f_login').focus();
}

function telaTrocaSenha() {
  const obrig = E.me.usuario.trocar_senha;
  const m = modal({
    title: obrig ? 'Defina uma nova senha' : 'Trocar senha',
    body: html`${obrig ? nota('Por segurança, troque a senha provisória informada pelo master antes de continuar.', 'warn') : ''}<form class="form" novalidate>
      ${campo({ n: 'atual', l: 'Senha atual', t: 'password', req: 1, full: 1 })}${campo({ n: 'nova', l: 'Nova senha (mín. 6 caracteres)', t: 'password', req: 1, full: 1 })}${campo({ n: 'conf', l: 'Repita a nova senha', t: 'password', req: 1, full: 1 })}</form>`,
    actions: [obrig ? { label: 'Sair', onClick: async () => { await sair(); } } : { label: 'Cancelar', onClick: a => a.close() },
    {
      label: 'Salvar senha', cls: 'pri', onClick: async a => {
        const v = lerForm(a.el, [{ n: 'atual' }, { n: 'nova' }, { n: 'conf' }]);
        if (v.nova !== v.conf) throw new Error('A confirmação não confere com a nova senha.');
        await post('/api/senha', { atual: v.atual, nova: v.nova });
        a.close(); toast('Senha alterada.');
        E.me = await get('/api/me'); await iniciarSessao();
      }
    }],
  });
  if (obrig) { const x = $('[data-x]', m.el); x.hidden = true; }
}

async function sair() {
  try { await post('/api/logout'); } catch { }
  E.me = null; E.empId = null; try { sessionStorage.removeItem('empId'); } catch { }
  $$('.overlay').forEach(o => o.remove()); telaLogin();
}

async function iniciarSessao() {
  $$('.overlay').forEach(o => o.remove());
  if (E.me.usuario.trocar_senha) { telaTrocaSenha(); return; }
  if (ehMaster()) {
    try { E.empId = sessionStorage.getItem('empId') || null; } catch { }
    E.empresas = await get('/api/empresas');
    if (E.empId && !E.empresas.some(e => String(e.id) === String(E.empId))) E.empId = null;
    if (E.empId) { try { E.me = await get('/api/me'); } catch { E.empId = null; } }
  }
  telaApp();
}

function telaApp() {
  const u = E.me.usuario, emp = E.me.empresa;
  const papel = { master: 'Master', admin: 'Admin da empresa', funcionario: 'Funcionário' }[u.papel];
  const perms = ['ver', 'lancar', 'aprovar'].filter(p => E.me.perm[p]).map(p => ({ ver: 'ver', lancar: 'lançar', aprovar: 'aprovar' }[p])).join(' · ');
  const seletor = ehMaster() ? html`<select id="selEmp" style="width:auto;max-width:260px" aria-label="Empresa em operação"><option value="">— selecione a empresa —</option>${E.empresas.map(e => html`<option value="${e.id}" ${String(e.id) === String(E.empId) ? raw('selected') : ''}>${e.nome}${e.ativa ? '' : ' (inativa)'}</option>`)}</select>` : html`<strong>${emp ? emp.nome : ''}</strong>`;
  mount($('#app'), html`<div class="shell"><aside class="side"><div class="brand">ERP Financeiro<small>Gestão financeira empresarial</small></div><nav class="nav">${raw(menu())}</nav></aside>
    <div class="main"><header class="top"><div class="row"><button class="btn sm menu-btn" data-a="menu" aria-label="Menu">☰</button>${seletor}${ehMaster() && emp ? html`<span class="pill ${emp.admin_pode_cadastrar ? 'ok' : 'pendente'}">${emp.admin_pode_cadastrar ? 'Admin pode cadastrar' : 'Cadastro centralizado no master'}</span>` : ''}</div>
    <div class="who"><span><strong>${u.nome}</strong> <span class="mut">(${u.login})</span></span><span class="pill">${papel}</span>${!ehMaster() ? html`<span class="mut" title="Permissões do acesso">${perms || 'sem permissões'}${E.me.perm.cadastro ? ' · cadastrar' : ''}</span>` : ''}
    <button class="btn sm" data-a="senha">Trocar senha</button><button class="btn sm" data-a="sair">Sair</button></div></header>
    <main class="content" id="view"></main></div></div>`);
  const s = $('#selEmp');
  if (s) s.addEventListener('change', async () => {
    E.empId = s.value || null; try { s.value ? sessionStorage.setItem('empId', s.value) : sessionStorage.removeItem('empId'); } catch { }
    E.me = await get('/api/me'); telaApp(); location.hash = '#/' + (E.empId ? 'painel' : 'empresas'); renderRota();
  });
  renderRota();
}
Object.assign(ACOES, {
  sair, senha: () => telaTrocaSenha(), menu: () => $('.side').classList.toggle('open'),
});
window.addEventListener('hashchange', renderRota);

// ───────── Empresas (master) ─────────
rota({
  id: 'empresas', titulo: 'Empresas clientes', grupo: 'Administração', master: true,
  async render() {
    E.empresas = await get('/api/empresas');
    const rows = E.empresas;
    return pagina('Empresas clientes', 'Cadastre as empresas, crie o login do admin de cada uma e controle se o admin pode realizar cadastros.',
      html`<button class="btn pri" data-a="emp-nova">+ Nova empresa</button>`,
      html`<div class="grid g4" style="margin-bottom:14px">${kpi('Empresas', rows.length)}${kpi('Ativas', rows.filter(r => r.ativa).length)}${kpi('Cadastro liberado ao admin', rows.filter(r => r.admin_pode_cadastrar).length)}${kpi('Acessos', rows.reduce((a, r) => a + r.n_usuarios, 0))}</div>
      <div class="card">${tbl([
        { h: 'Empresa', f: r => html`<strong>${r.nome}</strong><div class="mut">${r.cnpj || ''}</div>` },
        { h: 'Situação', f: r => pill(r.ativa ? 'Ativa' : 'Inativa', r.ativa ? 'ativa' : 'inativa') },
        { h: 'Admin (login)', f: r => r.admins || '—' },
        { h: 'Acessos', c: 'num', f: r => `${r.n_ativos}/${r.n_usuarios}` },
        { h: 'Cadastro pelo admin', f: r => r.admin_pode_cadastrar ? html`<span class="pill ok">Liberado</span> ${btn('emp-chave', r.id, 'Revogar', 'dng', { v: 0 })}` : html`<span class="pill pendente">Só o master</span> ${btn('emp-chave', r.id, 'Liberar', '', { v: 1 })}` },
        { h: '', f: r => html`<div class="row">${btn('emp-acessar', r.id, 'Acessar', 'pri')}${btn('emp-edit', r.id, 'Editar')}${btn('emp-acessos', r.id, 'Acessos')}</div>` },
      ], rows, { empty: 'Nenhuma empresa cadastrada. Clique em “Nova empresa”.' })}</div>`);
  }
});
Object.assign(ACOES, {
  'emp-nova': () => formModal({
    title: 'Nova empresa cliente', submit: 'Criar empresa e admin', wide: true,
    intro: 'Cria a empresa e o acesso principal (admin). Repasse o login e a senha à empresa manualmente; por padrão, o admin precisará trocar a senha no primeiro acesso.',
    fields: [{ n: 'nome', l: 'Nome da empresa', req: 1, full: 1 }, { n: 'cnpj', l: 'CNPJ' }, { n: 'admin_nome', l: 'Nome do admin' },
    { n: 'admin_login', l: 'Login do admin', req: 1, hint: 'Letras, números, . _ @ - (mín. 3)' }, { n: 'admin_senha', l: 'Senha provisória', req: 1, hint: 'Mínimo de 6 caracteres' },
    { n: 'admin_pode_cadastrar', l: 'Liberar cadastros (funcionários e dados) ao admin desta empresa', t: 'check', full: 1 },
    { n: 'exigir_troca', l: 'Exigir troca de senha no primeiro acesso', t: 'check', v: 1, full: 1 }],
    async onSubmit(v, a) {
      const r = await post('/api/empresas', v); a.close();
      modal({ title: 'Empresa criada', body: html`${nota('Anote e repasse as credenciais ao admin da empresa. A senha não poderá ser consultada depois.', 'good')}<div class="eqn">Empresa: ${v.nome}\nLogin:   ${v.admin_login}\nSenha:   ${v.admin_senha}</div>`, actions: [{ label: 'Fechar', cls: 'pri', onClick: x => x.close() }] });
      recarregar();
    }
  }),
  'emp-edit': async d => {
    const e = E.empresas.find(x => String(x.id) === d.id);
    formModal({
      title: 'Editar empresa', fields: [{ n: 'nome', l: 'Nome', v: e.nome, req: 1, full: 1 }, { n: 'cnpj', l: 'CNPJ', v: e.cnpj },
      { n: 'ativa', l: 'Empresa ativa (inativa bloqueia todos os acessos)', t: 'check', v: e.ativa, full: 1 },
      { n: 'admin_pode_cadastrar', l: 'Admin pode realizar cadastros', t: 'check', v: e.admin_pode_cadastrar, full: 1 }],
      async onSubmit(v, a) { await put('/api/empresas/' + d.id, v); a.close(); toast('Empresa atualizada.'); recarregar(); }
    });
  },
  'emp-chave': async d => {
    const lib = d.v === '1';
    if (!lib && !await confirmar('Revogar a permissão de cadastro do admin? Todo cadastro desta empresa passa a ser feito somente pelo master, com efeito imediato.', 'Revogar')) return;
    await put('/api/empresas/' + d.id, { admin_pode_cadastrar: lib ? 1 : 0 }); toast(lib ? 'Cadastro liberado ao admin.' : 'Permissão revogada.'); recarregar();
  },
  'emp-acessar': async d => {
    E.empId = d.id; try { sessionStorage.setItem('empId', d.id); } catch { }
    E.me = await get('/api/me'); telaApp(); location.hash = '#/painel';
  },
  'emp-acessos': d => { E.f.acessos = { empresa_id: d.id }; location.hash = '#/acessos'; },
});

// ───────── Acessos ─────────
rota({
  id: 'acessos', titulo: 'Acessos e permissões', grupo: 'Administração', admin: true,
  campos: [{ n: 'empresa_id', l: 'Empresa', t: 'select', opts: [] }],
  async render(el) {
    const f = filtroDe('acessos'); let q = {};
    if (ehMaster()) { if (f.empresa_id === undefined) f.empresa_id = E.empId || ''; E.f.acessos = f; if (f.empresa_id) q.empresa_id = f.empresa_id; }
    const rows = await get('/api/usuarios', q);
    E.usuarios = rows;
    const podeCad = ehMaster() || E.me.perm.cadastro;
    const filtro = ehMaster() ? html`<form class="filters no-print" data-filtro><div><label>Empresa</label><select name="empresa_id"><option value="">Todas</option>${E.empresas.map(e => html`<option value="${e.id}" ${String(e.id) === String(f.empresa_id) ? raw('selected') : ''}>${e.nome}</option>`)}</select></div><div><button class="btn pri">Aplicar</button></div></form>` : '';
    E.porId.acessos.campos = [{ n: 'empresa_id' }];
    return pagina('Acessos e permissões', ehMaster() ? 'Todos os acessos criados. Crie logins, defina permissões (ver, lançar, aprovar), redefina senhas e desative acessos.' : 'Funcionários da sua empresa e suas permissões.',
      podeCad ? html`<button class="btn pri" data-a="us-novo">+ Novo acesso</button>` : '',
      html`${!podeCad ? nota('O cadastro de acessos está centralizado no master para a sua empresa. Solicite ao master a criação ou alteração de acessos.', 'warn') : ''}${filtro}
      <div class="card">${tbl([
        { h: 'Nome', f: r => html`<strong>${r.nome}</strong><div class="mut">${r.login}</div>` },
        ...(ehMaster() ? [{ h: 'Empresa', f: r => r.empresa_nome }] : []),
        { h: 'Papel', f: r => r.papel === 'admin' ? 'Admin' : 'Funcionário' },
        { h: 'Permissões', f: r => r.papel === 'admin' ? 'ver · lançar · aprovar' : [r.p_ver && 'ver', r.p_lancar && 'lançar', r.p_aprovar && 'aprovar'].filter(Boolean).join(' · ') || '—' },
        { h: 'Situação', f: r => html`${pill(r.ativo ? 'Ativo' : 'Desativado', r.ativo ? 'ativa' : 'inativa')}${r.trocar_senha ? html` <span class="pill pendente">troca de senha pendente</span>` : ''}` },
        { h: '', f: r => (ehMaster() || (podeCad && r.papel === 'funcionario')) ? btn('us-edit', r.id, 'Editar') : '' },
      ], rows, { empty: 'Nenhum acesso encontrado.' })}</div>`);
  }
});
function camposUsuario(u, novo) {
  const f = [];
  if (novo) {
    if (ehMaster()) f.push({ n: 'empresa_id', l: 'Empresa', t: 'select', req: 1, v: E.empId || '', opts: [['', '— selecione —'], ...E.empresas.map(e => [e.id, e.nome])] },
      { n: 'papel', l: 'Papel', t: 'select', v: 'funcionario', opts: [['funcionario', 'Funcionário'], ['admin', 'Admin da empresa']] });
    f.push({ n: 'login', l: 'Login', req: 1 });
  }
  f.push({ n: 'nome', l: 'Nome', req: 1, v: u?.nome });
  if (novo) f.push({ n: 'senha', l: 'Senha provisória', req: 1, hint: 'Mínimo de 6 caracteres' });
  else f.push({ n: 'nova_senha', l: 'Redefinir senha (opcional)', hint: 'Deixe em branco para manter. Redefinir encerra as sessões do usuário.' });
  if (!u || u.papel !== 'admin') f.push({ n: 'p_ver', l: 'Pode ver (consultar dados e relatórios)', t: 'check', v: u ? u.p_ver : 1, full: 1 },
    { n: 'p_lancar', l: 'Pode lançar (lançamentos, títulos, baixas, caixa, orçamento)', t: 'check', v: u?.p_lancar, full: 1 },
    { n: 'p_aprovar', l: 'Pode aprovar (aprovar lançamentos, liberar crédito, análise de crédito)', t: 'check', v: u?.p_aprovar, full: 1 });
  if (!novo) f.push({ n: 'ativo', l: 'Acesso ativo', t: 'check', v: u.ativo, full: 1 });
  f.push({ n: 'exigir_troca', l: 'Exigir troca de senha no próximo acesso', t: 'check', v: 1, full: 1 });
  return f;
}
Object.assign(ACOES, {
  'us-novo': () => formModal({
    title: 'Novo acesso', submit: 'Criar acesso', fields: camposUsuario(null, true),
    async onSubmit(v, a) {
      await post('/api/usuarios', v); a.close();
      modal({ title: 'Acesso criado', body: html`${nota('Repasse o login e a senha ao usuário. A senha não poderá ser consultada depois.', 'good')}<div class="eqn">Login: ${v.login}\nSenha: ${v.senha}</div>`, actions: [{ label: 'Fechar', cls: 'pri', onClick: x => x.close() }] });
      recarregar();
    }
  }),
  'us-edit': d => {
    const u = E.usuarios.find(x => String(x.id) === d.id);
    formModal({
      title: 'Editar acesso — ' + u.login, fields: camposUsuario(u, false),
      async onSubmit(v, a) { if (!v.nova_senha) delete v.nova_senha; await put('/api/usuarios/' + d.id, v); a.close(); toast('Acesso atualizado.'); recarregar(); }
    });
  },
});

// ───────── Configurações contábeis da empresa ─────────
rota({
  id: 'config', titulo: 'Configurações', grupo: 'Administração', need: 'ver',
  async render() {
    const [cfg, contas] = await Promise.all([get('/api/config'), get('/api/contas', { analiticas: 1 })]);
    const op = tipo => [['', '— não configurada —'], ...contas.filter(c => c.tipo === tipo && c.ativa).map(c => [c.id, c.codigo + ' ' + c.nome])];
    const ed = pode('cadastro');
    return pagina('Configurações contábeis', 'Contas de controle usadas na provisão (competência) de contas a receber/pagar e na apuração de prazos e ciclos.', '',
      html`${!ed ? nota('Somente quem tem permissão de cadastro altera estas contas.', 'warn') : ''}<div class="card"><form class="form" id="cfgf" novalidate>
      ${campo({ n: 'cfg_clientes', l: 'Conta “Clientes / Duplicatas a receber”', t: 'select', v: cfg.cfg_clientes || '', opts: op('ativo'), hint: 'Ao emitir título a receber: D Clientes / C Receita.' })}
      ${campo({ n: 'cfg_fornecedores', l: 'Conta “Fornecedores”', t: 'select', v: cfg.cfg_fornecedores || '', opts: op('passivo'), hint: 'Ao emitir título a pagar: D Despesa / C Fornecedores.' })}
      ${campo({ n: 'cfg_estoques', l: 'Conta “Estoques”', t: 'select', v: cfg.cfg_estoques || '', opts: op('ativo'), hint: 'Usada para calcular o prazo médio de estocagem (PME).' })}
      </form>${ed ? html`<div style="margin-top:12px"><button class="btn pri" data-a="cfg-salvar">Salvar</button></div>` : ''}
      ${nota('Sem a conta de Clientes/Fornecedores, o título não gera provisão na emissão e a baixa lança direto contra a receita/despesa (regime de caixa).')}</div>`);
  }
});
ACOES['cfg-salvar'] = async () => {
  const v = lerForm($('#cfgf'), [{ n: 'cfg_clientes' }, { n: 'cfg_fornecedores' }, { n: 'cfg_estoques' }]);
  await put('/api/config', v); toast('Configurações salvas.');
};

// ───────── Auditoria ─────────
rota({
  id: 'auditoria', titulo: 'Auditoria', grupo: 'Administração', admin: true,
  async render() {
    const rows = await get('/api/auditoria', ehMaster() && E.empId ? { empresa_id: E.empId } : {});
    return pagina('Trilha de auditoria', 'Últimas 300 ações registradas (quem fez o quê e quando).', '', html`<div class="card">${tbl([
      { h: 'Data/hora', f: r => r.ts }, { h: 'Usuário', f: r => r.usuario_nome }, ...(ehMaster() ? [{ h: 'Empresa', f: r => r.empresa_nome || '—' }] : []),
      { h: 'Ação', f: r => r.acao }, { h: 'Detalhe', f: r => r.detalhe }], rows)}</div>`);
  }
});

// ───────── Painel ─────────
rota({
  id: 'painel', titulo: 'Painel', grupo: 'Visão geral', need: 'ver',
  async render() {
    const d = await get('/api/dashboard');
    const avisos = [];
    if (d.plano_vazio) avisos.push(nota(pode('cadastro') ? html`O plano de contas está vazio. Cadastre as contas em <a href="#/plano">Plano de contas</a> (ou carregue o plano modelo) para começar.` : 'O plano de contas ainda não foi cadastrado. Solicite o cadastro ao master.', 'warn'));
    if (d.pendentes_lancamentos) avisos.push(nota(html`${d.pendentes_lancamentos} lançamento(s) pendente(s) de aprovação — não entram nos relatórios até serem aprovados. ${pode('aprovar') ? html`<a href="#/aprovacoes">Aprovar</a>` : ''}`, 'warn'));
    if (d.titulos_bloqueados) avisos.push(nota(html`${d.titulos_bloqueados} título(s) a receber bloqueado(s) por limite de crédito. ${pode('aprovar') ? html`<a href="#/aprovacoes">Revisar</a>` : ''}`, 'bad'));
    return pagina(E.me.empresa.nome, 'Posição financeira atual e alertas.', '', html`${avisos}
      <div class="grid g4" style="margin-bottom:14px">
        ${kpi('Saldo em caixa e bancos', brl(d.saldo_caixa), '', colorVal(d.saldo_caixa))}
        ${kpi('A receber (em aberto)', brl(d.a_receber), d.n_receber + ' título(s)')}
        ${kpi('A pagar (em aberto)', brl(d.a_pagar), d.n_pagar + ' título(s)')}
        ${kpi('Resultado do mês', brl(d.resultado_mes), 'Receita bruta: ' + brl(d.receita_mes), colorVal(d.resultado_mes))}
        ${kpi('Recebimentos vencidos', brl(d.vencidos_receber), d.n_vencidos_receber + ' título(s)', d.vencidos_receber ? 'neg' : '')}
        ${kpi('Pagamentos vencidos', brl(d.vencidos_pagar), d.n_vencidos_pagar + ' título(s)', d.vencidos_pagar ? 'neg' : '')}
      </div>
      <div class="grid g2"><div class="card"><h2>Saldos por caixa/banco</h2>${tbl([{ h: 'Conta', f: r => r.nome }, { h: 'Saldo', c: 'num', f: r => html`<span class="${colorVal(r.saldo)}">${brl(r.saldo)}</span>` }], d.contas_fin, { empty: 'Nenhum caixa/banco cadastrado.' })}</div>
      <div class="card"><h2>Vencimentos nos próximos 15 dias</h2>${tbl([{ h: 'Venc.', f: r => fdata(r.vencimento) }, { h: 'Tipo', f: r => r.tipo === 'R' ? 'Receber' : 'Pagar' }, { h: 'Cliente/Fornecedor', f: r => r.parceiro }, { h: 'Valor', c: 'num', f: r => brlc(r.valor) }], d.proximos_vencimentos, { empty: 'Nada a vencer nos próximos 15 dias.' })}</div></div>`);
  }
});

// ───────── Aprovações ─────────
rota({

      { h: '#', f: r => r.id }, { h: 'Data', f: r => fdata(r.data) }, { h: 'Histórico', f: r => r.historico }, { h: 'Lançado por', f: r => r.criado_por_login }, { h: 'Valor', c: 'num', f: r => brlc(r.valor) },
      { h: '', f: r => html`<div class="row">${btn('l-ver', r.id, 'Ver')}${btn('l-aprovar', r.id, 'Aprovar', 'pri')}${btn('l-rejeitar', r.id, 'Rejeitar', 'dng')}</div>` }], d.lancamentos, { empty: 'Nenhum lançamento pendente.' })}</div>
      <div class="card"><h2>Títulos a receber bloqueados por crédito</h2>${tbl([
        { h: '#', f: r => r.id }, { h: 'Cliente', f: r => r.parceiro_nome }, { h: 'Venc.', f: r => fdata(r.vencimento) }, { h: 'Valor', c: 'num', f: r => brl(r.valor_r) }, { h: 'Motivo', f: r => r.motivo_bloqueio },
        { h: '', f: r => html`<div class="row">${btn('t-liberar', r.id, 'Liberar venda', 'pri')}${btn('t-cancelar', r.id, 'Cancelar', 'dng')}</div>` }], d.titulos, { empty: 'Nenhum título bloqueado.' })}</div>`);

<script>
'use strict';
/* Contabilidade: plano de contas, lançamentos, balancete, DRE e balanço patrimonial. */

const parseMoney = s => {
  s = String(s ?? '').trim(); if (!s) return NaN;
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.'); else if (s.includes(',')) s = s.replace(',', '.');
  return Number(s);
};
const anoIni = () => hojeISO().slice(0, 4) + '-01-01';
const TIPOS = [['ativo', 'Ativo'], ['passivo', 'Passivo'], ['pl', 'Patrimônio líquido'], ['receita', 'Receita'], ['despesa', 'Despesa / custo']];
const TIPO_NOME = Object.fromEntries(TIPOS);
const SUBT = [['', '(automático / herdar da conta pai)'], ['vendas', 'Receita de vendas/serviços'], ['financeira', 'Financeira (receita ou despesa)'], ['tributos', 'Tributos sobre vendas'],
['custos_diretos', 'Custos diretos (variáveis)'], ['custos_indiretos', 'Custos indiretos'], ['despesas', 'Despesas operacionais']];
const SUBT_NOME = Object.fromEntries(SUBT);
async function contasOpcoes(filtro, vazio = '— selecione —') {
  const cs = await get('/api/contas', { analiticas: 1 });
  E.contasAn = cs.filter(c => c.ativa);
  return [['', vazio], ...E.contasAn.filter(filtro || (() => true)).map(c => [c.id, c.codigo + ' — ' + c.nome])];
}

// ───────── Plano de contas ─────────
rota({
  id: 'plano', titulo: 'Plano de contas', grupo: 'Contabilidade', need: 'ver',
  async render() {
    const rows = await get('/api/contas'); E.contas = rows;
    const ed = pode('cadastro');
    return pagina('Plano de contas', 'Estrutura hierárquica: contas sintéticas agrupam; só as analíticas recebem lançamentos. Ex.: 1 Ativo › 1.1 Ativo Circulante › 1.1.1 Caixa.',
      ed ? html`<button class="btn" data-a="pc-modelo">Carregar plano modelo</button><button class="btn pri" data-a="pc-nova">+ Nova conta</button>` : '',
      html`${!ed ? nota('Cadastros não liberados para o seu acesso. Solicite ao master (ou ao admin, se liberado).', 'warn') : ''}<div class="card">${tbl([
        { h: 'Código', f: r => html`<span class="${r.analitica ? '' : 'mut'}">${r.codigo}</span>` },
        { h: 'Conta', cls: r => 'indent' + Math.min(r.nivel - 1, 4), f: r => r.analitica ? r.nome : html`<strong>${r.nome}</strong>` },
        { h: 'Tipo', f: r => TIPO_NOME[r.tipo] }, { h: 'Natureza', f: r => r.natureza === 'D' ? 'Devedora' : 'Credora' },
        { h: 'Classificação DRE', f: r => r.subtipo ? SUBT_NOME[r.subtipo] : '—' },
        { h: 'Conta', f: r => r.analitica ? 'Analítica' : 'Sintética' },
        { h: 'Situação', f: r => pill(r.ativa ? 'Ativa' : 'Inativa', r.ativa ? 'ativa' : 'inativa') },
        ...(ed ? [{ h: '', f: r => html`<div class="row">${btn('pc-edit', r.id, 'Editar')}${btn('pc-del', r.id, 'Excluir', 'dng')}</div>` }] : [])],
        rows, { empty: 'Plano vazio. Cadastre a primeira conta (ex.: 1 — ATIVO) ou carregue o plano modelo.', rowCls: r => r.analitica ? '' : 'sint' })}</div>`);
  }
});
Object.assign(ACOES, {
  'pc-modelo': async () => {
    if (!await confirmar('Carregar o plano de contas modelo? Só serão criadas as contas cujos códigos ainda não existem; as contas de controle (Clientes, Fornecedores, Estoques) serão configuradas se estiverem vazias.', 'Carregar')) return;
    const r = await post('/api/contas/modelo'); toast(r.criadas + ' conta(s) criada(s).'); recarregar();
  },
  'pc-nova': () => formModal({
    title: 'Nova conta', submit: 'Criar conta',
    intro: 'Crie primeiro as contas de nível superior (1, 2, 3…). Subcontas (1.1, 1.1.1…) exigem que a conta pai exista, seja sintética e herdam o tipo dela.',
    fields: [{ n: 'codigo', l: 'Código', req: 1, ph: '1.1.1', hint: 'Números separados por ponto' }, { n: 'nome', l: 'Nome', req: 1 },
    { n: 'tipo', l: 'Tipo (contas de 1º nível)', t: 'select', opts: TIPOS }, { n: 'subtipo', l: 'Classificação na DRE (receitas e despesas)', t: 'select', opts: SUBT },
    { n: 'analitica', l: 'Conta analítica (recebe lançamentos)', t: 'check', v: 1, full: 1 }],
    async onSubmit(v, a) {
      if (v.codigo.includes('.')) delete v.tipo; if (!v.subtipo) delete v.subtipo;
      await post('/api/contas', v); a.close(); toast('Conta criada.'); recarregar();
    }
  }),
  'pc-edit': d => {
    const c = E.contas.find(x => String(x.id) === d.id);
    formModal({
      title: `Editar conta ${c.codigo}`, fields: [{ n: 'nome', l: 'Nome', v: c.nome, req: 1, full: 1 },
      ...(['receita', 'despesa'].includes(c.tipo) ? [{ n: 'subtipo', l: 'Classificação na DRE', t: 'select', v: c.subtipo || '', opts: SUBT.filter(s => s[0]) }] : []),
      { n: 'analitica', l: 'Conta analítica', t: 'check', v: c.analitica }, { n: 'ativa', l: 'Conta ativa', t: 'check', v: c.ativa }],
      async onSubmit(v, a) { await put('/api/contas/' + d.id, v); a.close(); toast('Conta atualizada.'); recarregar(); }
    });
  },
  'pc-del': async d => {
    const c = E.contas.find(x => String(x.id) === d.id);
    if (!await confirmar(`Excluir a conta ${c.codigo} — ${c.nome}?`, 'Excluir')) return;
    await del('/api/contas/' + d.id); toast('Conta excluída.'); recarregar();
  },
});

// ───────── Lançamentos ─────────
const CAMPOS_LANC = [{ n: 'de', l: 'De', t: 'date' }, { n: 'ate', l: 'Até', t: 'date' },
{ n: 'status', l: 'Situação', t: 'select', opts: [['', 'Todas'], ['aprovado', 'Aprovado'], ['pendente', 'Pendente'], ['rejeitado', 'Rejeitado']] },
{ n: 'origem', l: 'Origem', t: 'select', opts: [['', 'Todas'], ...Object.entries(ORIGEM)] }, { n: 'q', l: 'Histórico contém' }];
rota({
  id: 'lancamentos', titulo: 'Lançamentos contábeis', grupo: 'Contabilidade', need: 'ver', campos: CAMPOS_LANC,
  async render() {
    const f = filtroDe('lancamentos'); const rows = await get('/api/lancamentos', f);
    return pagina('Lançamentos contábeis', 'Partidas dobradas: a soma dos débitos deve ser igual à soma dos créditos. Os saldos alimentam balancete, DRE e balanço.',
      pode('lancar') ? html`<button class="btn pri" data-a="l-novo">+ Novo lançamento</button>` : '',
      html`${filtros(CAMPOS_LANC, f)}<div class="card">${tbl([
        { h: '#', f: r => r.id }, { h: 'Data', f: r => fdata(r.data) }, { h: 'Histórico', f: r => html`${r.historico}${r.estornado_por ? html` <span class="pill cancelado">estornado</span>` : ''}` },
        { h: 'Origem', f: r => ORIGEM[r.origem] || r.origem }, { h: 'Situação', f: r => stPill(r.status) }, { h: 'Por', f: r => r.criado_por_login || '—' },
        { h: 'Valor', c: 'num', f: r => brlc(r.valor) }, { h: '', f: r => btn('l-ver', r.id, 'Ver') }], rows, { empty: 'Nenhum lançamento no filtro.' })}</div>`);
  }
});
async function verLancamento(id) {
  const l = await get('/api/lancamentos/' + id);
  const deb = l.itens.filter(i => i.dc === 'D').reduce((a, i) => a + i.valor, 0), cred = l.itens.filter(i => i.dc === 'C').reduce((a, i) => a + i.valor, 0);
  const acoes = [{ label: 'Fechar', onClick: a => a.close() }];
  if (l.status === 'pendente' && pode('aprovar')) acoes.push({ label: 'Rejeitar', cls: 'dng', onClick: async a => { await post(`/api/lancamentos/${id}/rejeitar`); a.close(); toast('Lançamento rejeitado.'); recarregar(); } }, { label: 'Aprovar', cls: 'pri', onClick: async a => { await post(`/api/lancamentos/${id}/aprovar`); a.close(); toast('Lançamento aprovado.'); recarregar(); } });
  if (l.origem === 'manual' && l.status === 'aprovado' && !l.estornado_por && pode('lancar')) acoes.splice(1, 0, { label: 'Estornar', cls: 'dng', onClick: async a => { if (!await confirmar('Gerar o lançamento de estorno (inverte débitos e créditos)?', 'Estornar')) return; const r = await post(`/api/lancamentos/${id}/estornar`); a.close(); toast('Estorno lançado (' + r.status + ').'); recarregar(); } });
  modal({
    title: `Lançamento #${l.id}`, wide: true, actions: acoes,
    body: html`<div class="row" style="margin-bottom:10px"><strong>${fdata(l.data)}</strong>${stPill(l.status)}<span class="mut">${ORIGEM[l.origem] || l.origem}</span></div><p>${l.historico}</p>
      ${tbl([{ h: 'Conta', f: i => `${i.codigo} — ${i.conta_nome}` }, { h: 'Débito', c: 'num', f: i => i.dc === 'D' ? brlc(i.valor) : '' }, { h: 'Crédito', c: 'num', f: i => i.dc === 'C' ? brlc(i.valor) : '' }], l.itens)}
      <p class="hint">Total de débitos ${brlc(deb)} = total de créditos ${brlc(cred)}${l.estorno_de ? ` · estorno do lançamento #${l.estorno_de}` : ''}${l.estornado_por ? ` · estornado pelo #${l.estornado_por}` : ''}</p>`
  });
}
ACOES['l-ver'] = d => verLancamento(d.id);
ACOES['l-aprovar'] = async d => { await post(`/api/lancamentos/${d.id}/aprovar`); toast('Lançamento aprovado.'); recarregar(); };
ACOES['l-rejeitar'] = async d => { if (!await confirmar('Rejeitar este lançamento?', 'Rejeitar')) return; await post(`/api/lancamentos/${d.id}/rejeitar`); toast('Lançamento rejeitado.'); recarregar(); };
ACOES['t-liberar'] = async d => { await post(`/api/titulos/${d.id}/liberar`); toast('Venda liberada.'); recarregar(); };
ACOES['t-cancelar'] = async d => { if (!await confirmar('Cancelar este título?', 'Cancelar título')) return; await post(`/api/titulos/${d.id}/cancelar`); toast('Título cancelado.'); recarregar(); };

ACOES['l-novo'] = async () => {
  const cfs = await get('/api/contas-fin'); const bloqueadas = new Set(cfs.map(c => c.conta_id));
  const opts = (await contasOpcoes()).filter(([v]) => !bloqueadas.has(v));
  const linha = () => `<tr><td><select class="lc" aria-label="Conta">${opts.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select></td>
    <td style="width:120px"><select class="ld" aria-label="Débito ou crédito"><option value="D">Débito</option><option value="C">Crédito</option></select></td>
    <td style="width:150px"><input class="lv" inputmode="decimal" placeholder="0,00" aria-label="Valor"></td><td style="width:44px"><button type="button" class="btn sm" data-rm aria-label="Remover linha">✕</button></td></tr>`;
  formModal({
    title: 'Novo lançamento', wide: true, submit: 'Registrar lançamento',
    intro: (pode('aprovar') ? 'Como você pode aprovar, o lançamento entra direto nos saldos.' : 'O lançamento ficará pendente até ser aprovado por quem tem permissão de aprovar.') + ' Contas de caixa e bancos não aparecem aqui: use “Caixa e bancos” para movimentá-las.',
    fields: [{ n: 'data', l: 'Data', t: 'date', v: hojeISO(), req: 1 }, { n: 'historico', l: 'Histórico', req: 1 }],
    extra: html`<div class="full"><div class="tablewrap"><table><thead><tr><th>Conta (analítica)</th><th>D/C</th><th>Valor (R$)</th><th></th></tr></thead><tbody id="ltb"></tbody></table></div>
      <div class="row" style="margin-top:8px;justify-content:space-between"><button type="button" class="btn sm" id="ladd">+ Linha</button><div id="ltot" class="mut"></div></div></div>`,
    onOpen(ov) {
      const tb = $('#ltb', ov), tot = $('#ltot', ov);
      const calc = () => {
        let d = 0, c = 0; $$('tr', tb).forEach(tr => { const v = parseMoney($('.lv', tr).value) || 0; $('.ld', tr).value === 'D' ? d += v : c += v; });
        const ok = Math.abs(d - c) < 0.005 && d > 0;
        tot.innerHTML = `Débitos <strong>${brl(d)}</strong> · Créditos <strong>${brl(c)}</strong> · <span class="${ok ? 'pos' : 'neg'}">${ok ? 'balanceado ✓' : 'diferença ' + brl(Math.abs(d - c))}</span>`;
      };
      const add = dc => { tb.insertAdjacentHTML('beforeend', linha()); if (dc) $$('.ld', tb).pop().value = dc; calc(); };
      add('D'); add('C');
      $('#ladd', ov).addEventListener('click', () => add(''));
      tb.addEventListener('input', calc); tb.addEventListener('change', calc);
      tb.addEventListener('click', e => { if (e.target.closest('[data-rm]') && $$('tr', tb).length > 2) { e.target.closest('tr').remove(); calc(); } });
    },
    async onSubmit(v, a) {
      const itens = $$('#ltb tr', a.el).map(tr => ({ conta_id: $('.lc', tr).value, dc: $('.ld', tr).value, valor: $('.lv', tr).value }));
      if (itens.some(i => !i.conta_id || !i.valor)) throw new Error('Preencha a conta e o valor de todas as linhas (ou remova as linhas em branco).');
      const r = await post('/api/lancamentos', { ...v, itens: itens.map(i => ({ ...i, conta_id: Number(i.conta_id) })) });
      a.close(); toast(r.status === 'aprovado' ? 'Lançamento registrado.' : 'Lançamento enviado para aprovação.'); recarregar();
    }
  });
};

// ───────── Balancete ─────────
const CAMPOS_BAL = [{ n: 'de', l: 'De', t: 'date' }, { n: 'ate', l: 'Até', t: 'date' }, { n: 'todas', l: 'Contas sem movimento', t: 'select', opts: [['', 'Ocultar'], ['1', 'Mostrar']] }];
const dc = o => o.valor ? html`${brl(o.valor)} <span class="mut">${o.dc}</span>` : '—';
rota({
  id: 'balancete', titulo: 'Balancete', grupo: 'Relatórios', need: 'ver', campos: CAMPOS_BAL,
  async render() {
    const f = { de: anoIni(), ate: hojeISO(), ...filtroDe('balancete') }; const r = await get('/api/relatorios/balancete', f); const t = r.totais;
    return pagina('Balancete de verificação', `Saldos, débitos e créditos por conta de ${fdata(r.de)} a ${fdata(r.ate)} (somente lançamentos aprovados).`,
      html`<button class="btn" data-a="bal-csv">Exportar CSV</button>`,
      html`${filtros(CAMPOS_BAL, f)}${t.conferido ? nota('Balancete conferido: total de débitos = total de créditos.', 'good') : nota('Atenção: débitos e créditos não fecham.', 'bad')}
      <div class="card">${tbl([
        { h: 'Código', f: x => x.codigo }, { h: 'Conta', cls: x => 'indent' + Math.min(x.nivel - 1, 4), f: x => x.nome },
        { h: 'Saldo anterior', c: 'num', f: x => dc(x.saldo_anterior) }, { h: 'Débitos', c: 'num', f: x => x.debitos ? brl(x.debitos) : '—' }, { h: 'Créditos', c: 'num', f: x => x.creditos ? brl(x.creditos) : '—' }, { h: 'Saldo final', c: 'num', f: x => dc(x.saldo_final) }],
        r.linhas, { empty: 'Sem movimento no período.', rowCls: x => x.analitica ? '' : 'sint' })}
        ${r.linhas.length ? html`<div class="tablewrap" style="margin-top:8px"><table><tbody><tr class="tot"><td>Totais (contas analíticas)</td><td class="num">Saldo anterior D ${brl(t.ant_d)} · C ${brl(t.ant_c)}</td><td class="num">Débitos ${brl(t.deb)}</td><td class="num">Créditos ${brl(t.cred)}</td><td class="num">Saldo final D ${brl(t.fin_d)} · C ${brl(t.fin_c)}</td></tr></tbody></table></div>` : ''}</div>`);
  }
});
ACOES['bal-csv'] = async () => {
  const f = { de: anoIni(), ate: hojeISO(), ...filtroDe('balancete') }; const r = await get('/api/relatorios/balancete', f);
  csv('balancete.csv', [['Código', 'Conta', 'Saldo anterior', 'D/C', 'Débitos', 'Créditos', 'Saldo final', 'D/C'], ...r.linhas.map(x => [x.codigo, x.nome, x.saldo_anterior.valor, x.saldo_anterior.dc, x.debitos, x.creditos, x.saldo_final.valor, x.saldo_final.dc])]);
};

// ───────── DRE ─────────
const CAMPOS_DRE = [{ n: 'de', l: 'De', t: 'date' }, { n: 'ate', l: 'Até', t: 'date' }];
rota({
  id: 'dre', titulo: 'DRE', grupo: 'Relatórios', need: 'ver', campos: CAMPOS_DRE,
  async render() {
    const f = { de: anoIni(), ate: hojeISO(), ...filtroDe('dre') }; const r = await get('/api/relatorios/dre', f);
    return pagina('Demonstração do Resultado do Exercício', `Período de ${fdata(r.de)} a ${fdata(r.ate)}. A análise vertical (AV) usa a receita bruta como base.`, '',
      html`${filtros(CAMPOS_DRE, f)}<div class="card">${tbl([
        { h: 'Descrição', cls: x => x.tipo === 'conta' ? 'indent2' : '', f: x => x.rotulo }, { h: 'Valor (R$)', c: 'num', f: x => html`<span class="${x.tipo !== 'conta' ? colorVal(x.valor) : ''}">${num(x.valor)}</span>` }, { h: 'AV %', c: 'num', f: x => x.av == null ? '—' : pct(x.av) }],
        r.linhas, { empty: 'Sem receitas e despesas no período.', rowCls: x => x.destaque ? 'dest' : x.tipo === 'total' ? 'tot' : x.tipo === 'grupo' ? 'sint' : '' })}</div>`);
  }
});

// ───────── Balanço patrimonial ─────────
const CAMPOS_BP = [{ n: 'ate', l: 'Posição em', t: 'date' }];
rota({
  id: 'balanco', titulo: 'Balanço patrimonial', grupo: 'Relatórios', need: 'ver', campos: CAMPOS_BP,
  async render() {
    const f = { ate: hojeISO(), ...filtroDe('balanco') }; const r = await get('/api/relatorios/balanco', f);
    const sec = (tit, s) => html`<div class="card"><h2>${tit}</h2>${tbl([{ h: 'Conta', cls: x => 'indent' + Math.min(x.nivel - 1, 4), f: x => x.codigo ? `${x.codigo} ${x.nome}` : x.nome }, { h: 'Saldo (R$)', c: 'num', f: x => num(x.valor) }], s.linhas, { empty: 'Sem saldos.', rowCls: x => x.analitica ? '' : 'sint' })}
      <div class="tablewrap" style="margin-top:8px"><table><tbody><tr class="tot"><td>Total — ${tit}</td><td class="num">${brl(s.total)}</td></tr></tbody></table></div></div>`;
    return pagina('Balanço patrimonial', `Posição em ${fdata(r.ate)} gerada a partir dos lançamentos aprovados. O resultado do exercício entra no patrimônio líquido.`, '',
      html`${filtros(CAMPOS_BP, f)}${r.conferido ? nota(`Balanço fechado: Ativo ${brl(r.ativo.total)} = Passivo + Patrimônio líquido ${brl(r.passivo_mais_pl)}.`, 'good') : nota(`Atenção: Ativo ${brl(r.ativo.total)} ≠ Passivo + PL ${brl(r.passivo_mais_pl)}.`, 'bad')}
      <div class="grid g2"><div>${sec('Ativo', r.ativo)}</div><div>${sec('Passivo', r.passivo)}${sec('Patrimônio líquido', r.pl)}<div class="kpi"><div class="l">Passivo + Patrimônio líquido</div><div class="v">${brl(r.passivo_mais_pl)}</div></div></div></div>`);
  }
});

</script>
<script>
'use strict';
/* Financeiro: clientes/fornecedores, caixas e bancos, contas a pagar/receber, fluxo de caixa e ciclos. */

const CRED_ST = { ok: ['Dentro do limite', 'ok'], alerta: ['Perto do limite', 'alerta'], excedido: ['Limite excedido', 'excedido'], bloqueado: ['Bloqueado', 'bloqueado'] };

// ───────── Clientes e fornecedores ─────────
rota({
  id: 'parceiros', titulo: 'Clientes e fornecedores', grupo: 'Financeiro', need: 'ver',
  async render() {
    const rows = await get('/api/parceiros'); E.parceiros = rows; const ed = pode('cadastro');
    return pagina('Clientes e fornecedores', 'Cadastro com dados para análise de crédito. O limite de crédito é aplicado sobre os títulos a receber em aberto.',
      ed ? html`<button class="btn pri" data-a="pa-novo">+ Novo cadastro</button>` : '',

function tituloRota(id, tipo, titulo, sub) {

    id, titulo, grupo: 'Financeiro', need: 'ver', campos,
    async render() {
      const f = filtroDe(id); const [rows, ps] = await Promise.all([get('/api/titulos', { ...f, tipo }), get('/api/parceiros', { tipo: tipo === 'R' ? 'cliente' : 'fornecedor' })]);
      E.titulos = rows;
      const cp = campos.map(c => c.n === 'parceiro_id' ? { ...c, t: 'select', opts: [['', 'Todos'], ...ps.map(p => [p.id, p.nome])] } : c);
      const aberto = rows.filter(r => r.status === 'aberto'), venc = aberto.filter(r => r.dias_atraso > 0);
      return pagina(titulo, sub, pode('lancar') ? html`<button class="btn pri" data-a="ti-novo" data-tipo="${tipo}">+ Novo título</button>` : '',
        html`<div class="grid g4" style="margin-bottom:14px">${kpi('Em aberto', brl(aberto.reduce((a, r) => a + r.valor_r, 0)), aberto.length + ' título(s)')}${kpi('Vencidos', brl(venc.reduce((a, r) => a + r.valor_r, 0)), venc.length + ' título(s)', venc.length ? 'neg' : '')}${kpi('Baixados (no filtro)', brl(rows.filter(r => r.status === 'pago').reduce((a, r) => a + r.valor_r, 0)))}</div>
        ${filtros(cp, f)}<div class="card">${tbl([
          { h: '#', f: r => r.id }, { h: tipo === 'R' ? 'Cliente' : 'Fornecedor', f: r => html`${r.parceiro_nome}${r.excede_limite ? html` <span class="pill ${r.status === 'bloqueado' ? 'bloqueado' : 'alerta'}" title="${r.motivo_bloqueio}">limite excedido</span>` : ''}` },
          { h: 'Histórico', f: r => html`${r.historico}<div class="mut">${r.numero ? 'Doc ' + r.numero + ' · ' : ''}${r.conta_codigo} ${r.conta_nome}${r.total_parcelas > 1 ? ` · parcela ${r.parcela}/${r.total_parcelas}` : ''}</div>` },
          { h: 'Emissão', f: r => fdata(r.data_emissao) }, { h: 'Vencimento', f: r => html`${fdata(r.vencimento)}${r.dias_atraso ? html`<div class="neg">${r.dias_atraso} dia(s) de atraso</div>` : ''}` },
          { h: 'Valor', c: 'num', f: r => brl(r.valor_r) }, { h: 'Situação', f: r => html`${stPill(r.status)}${r.data_baixa ? html`<div class="mut">${fdata(r.data_baixa)}</div>` : ''}` },
          { h: '', f: r => !pode('lancar') ? '' : r.status === 'aberto' ? html`<div class="row">${btn('ti-baixa', r.id, tipo === 'R' ? 'Receber' : 'Pagar', 'pri')}${btn('t-cancelar', r.id, 'Cancelar')}</div>` : r.status === 'pago' ? btn('ti-estorno', r.id, 'Estornar baixa') : r.status === 'bloqueado' ? html`<div class="row">${pode('aprovar') ? btn('t-liberar', r.id, 'Liberar', 'pri') : ''}${btn('t-cancelar', r.id, 'Cancelar')}</div>` : '' }],
          rows, { empty: 'Nenhum título encontrado.', rowCls: r => r.dias_atraso ? 'bad' : '' })}</div>`);
    }
  });
}
