        ['PME', dias(r.pme), r.pme_fonte]])}
      <p class="hint">O balanço usa as contas de Clientes, Fornecedores e Estoques definidas em Configurações.</p></div>`);
  }
});

</script>
<script>
'use strict';
/* Gestão: orçamento, orçado x realizado, crédito, cobrança, investimentos e margem de contribuição. */

const MESES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
const CATS = { vendas: 'Orçamento de vendas', tributos: 'Tributos', custos_diretos: 'Custos diretos', custos_indiretos: 'Custos indiretos', despesas: 'Despesas', financeiro: 'Financeiro', caixa: 'Orçamento de caixa (saldo projetado)' };
const CAT_ORD = Object.keys(CATS);
const catDe = c => c.tipo === 'ativo' ? 'caixa' : c.tipo === 'receita' ? (c.subtipo === 'vendas' ? 'vendas' : 'financeiro') : ({ tributos: 'tributos', custos_diretos: 'custos_diretos', custos_indiretos: 'custos_indiretos', financeira: 'financeiro' }[c.subtipo] || 'despesas');
const SIT = { ok: 'Dentro da tolerância', favoravel: 'Favorável', desfavoravel: 'Desfavorável', sem_orcamento: 'Sem orçamento' };
const sitPill = s => html`<span class="pill ${s}">${SIT[s] || s}</span>`;

// ───────── Orçamento ─────────
rota({
  id: 'orcamento', titulo: 'Orçamento', grupo: 'Planejamento', need: 'ver', campos: [{ n: 'ano' }],
  async render() {
    const f = filtroDe('orcamento'); const ano = Number(f.ano) || new Date().getFullYear();
    const [o, cs] = await Promise.all([get('/api/orcamento', { ano }), get('/api/contas', { analiticas: 1 })]);
    E.orc = { ano, linhas: o.linhas.map(l => ({ conta_id: l.conta_id, valores: l.valores.slice() })) };
    E.orcContas = cs.filter(c => c.ativa && ['receita', 'despesa', 'ativo'].includes(c.tipo));
    return pagina(`Orçamento empresarial ${ano}`, 'Planeje mês a mês: vendas, custos diretos e indiretos, despesas, tributos e caixa. Receitas e despesas são comparadas ao realizado; contas do Ativo (caixa/bancos) orçam o saldo previsto.',
      html`${pode('lancar') ? html`<button class="btn pri" data-a="orc-salvar">Salvar orçamento</button>` : ''}`,
      html`${!pode('lancar') ? nota('Você pode consultar o orçamento, mas não alterá-lo (requer permissão de lançar).', 'warn') : ''}
      <form class="filters no-print" data-filtro><div><label for="f_ano">Ano</label><input id="f_ano" name="ano" type="number" value="${ano}" min="2000" max="2100"></div><div><button class="btn" type="submit">Abrir ano</button></div></form>
      <div class="card" id="orcbox"></div>`);
  },
  after() { orcDesenhar(); }
});
function orcLer() { // sincroniza estado a partir do DOM
  const tb = $('#orcbox table'); if (!tb) return;
  E.orc.linhas.forEach(l => { const tr = $(`tr[data-c="${l.conta_id}"]`, tb); if (tr) l.valores = $$('input', tr).map(i => i.value); });
}
function orcDesenhar() {
  const box = $('#orcbox'); if (!box) return; const ed = pode('lancar');
  const mapa = Object.fromEntries(E.orcContas.map(c => [c.id, c]));
  const usadas = new Set(E.orc.linhas.map(l => l.conta_id));
  const livres = E.orcContas.filter(c => !usadas.has(c.id));
  const grupos = CAT_ORD.map(k => [k, E.orc.linhas.filter(l => mapa[l.conta_id] && catDe(mapa[l.conta_id]) === k)]).filter(g => g[1].length);
  const tot = l => l.valores.reduce((a, v) => a + (parseMoney(v) || 0), 0);
  const corpo = grupos.map(([k, ls]) => html`<tr class="tot"><td colspan="${ed ? 15 : 14}">${CATS[k]}</td></tr>${ls.map(l => { const c = mapa[l.conta_id]; return html`<tr data-c="${l.conta_id}"><td style="min-width:200px">${c.codigo} ${c.nome}</td>${l.valores.map((v, i) => html`<td><input ${ed ? '' : raw('readonly')} class="mi" style="min-width:84px;text-align:right" inputmode="decimal" aria-label="${c.nome} ${MESES[i]}" value="${Number(v) ? String(v).replace('.', ',') : ''}" placeholder="0"></td>`)}<td class="num ot">${num(tot(l))}</td>${ed ? html`<td style="white-space:nowrap"><button class="btn sm" data-a="orc-fill" data-id="${l.conta_id}" title="Repete o primeiro valor preenchido nos 12 meses">Repetir</button> <button class="btn sm dng" data-a="orc-rm" data-id="${l.conta_id}" aria-label="Remover conta">✕</button></td>` : ''}</tr>`; })}`);
  mount(box, html`${ed ? html`<div class="filters no-print"><div style="flex:1 1 320px"><label for="orc_add">Adicionar conta ao orçamento</label><select id="orc_add"><option value="">— selecione —</option>${livres.map(c => html`<option value="${c.id}">${c.codigo} — ${c.nome} (${CATS[catDe(c)].replace('Orçamento de ', '')})</option>`)}</select></div><div><button class="btn" data-a="orc-add">+ Adicionar</button></div></div>` : ''}
    ${grupos.length ? html`<div class="tablewrap"><table><thead><tr><th>Conta</th>${MESES.map(m => html`<th class="num">${m}</th>`)}<th class="num">Total</th>${ed ? html`<th></th>` : ''}</tr></thead><tbody>${corpo}</tbody></table></div>` : html`<div class="empty">Nenhuma conta orçada neste ano. Adicione contas de receita, despesa ou caixa acima.</div>`}
    <p class="hint">Informe os valores mensais em reais (use vírgula para centavos). Contas do Ativo aceitam valores negativos. Clique em “Salvar orçamento” para gravar.</p>`);
  $$('#orcbox .mi').forEach(i => i.addEventListener('input', () => { const tr = i.closest('tr'); $('.ot', tr).textContent = num($$('.mi', tr).reduce((a, x) => a + (parseMoney(x.value) || 0), 0)); }));
}
Object.assign(ACOES, {
  'orc-add': () => { orcLer(); const v = $('#orc_add').value; if (!v) return; E.orc.linhas.push({ conta_id: Number(v), valores: Array(12).fill(0) }); orcDesenhar(); },
  'orc-rm': d => { orcLer(); E.orc.linhas = E.orc.linhas.filter(l => String(l.conta_id) !== d.id); orcDesenhar(); },
  'orc-fill': d => { orcLer(); const l = E.orc.linhas.find(x => String(x.conta_id) === d.id); const v = l.valores.find(x => parseMoney(x)); if (v === undefined) return toast('Preencha ao menos um mês.', true); l.valores = Array(12).fill(v); orcDesenhar(); },
  'orc-salvar': async () => {
    orcLer();
    const linhas = E.orc.linhas.map(l => ({ conta_id: l.conta_id, valores: l.valores.map(v => { const n = parseMoney(v); if (v !== '' && v != null && Number.isNaN(n)) throw new Error('Valor inválido no orçamento: ' + v); return String(n || 0); }) }));
    await put('/api/orcamento', { ano: E.orc.ano, linhas }); toast('Orçamento salvo.');
  },
});

// ───────── Orçado x realizado ─────────
const mesAtual = () => hojeISO().slice(0, 7);
const CAMPOS_OR = [{ n: 'de', l: 'Mês inicial', t: 'month' }, { n: 'ate', l: 'Mês final', t: 'month' }, { n: 'tolerancia', l: 'Tolerância do desvio (%)', t: 'number', v: 5 }];
rota({
  id: 'orcado-realizado', titulo: 'Orçado x realizado', grupo: 'Planejamento', need: 'ver', campos: CAMPOS_OR,
  async render() {
    const f = { de: mesAtual().slice(0, 4) + '-01', ate: mesAtual().slice(0, 4) + '-12', tolerancia: 5, ...filtroDe('orcado-realizado') }; const r = await get('/api/relatorios/orcado-realizado', f); E.orcrel = r;
    const campos = CAMPOS_OR.map(c => c.t === 'month' ? { ...c, t: 'text', ph: 'AAAA-MM' } : c);
    const dv = x => html`<span class="${x.situacao === 'favoravel' ? 'pos' : x.situacao === 'desfavoravel' ? 'neg' : ''}">${brl(x.desvio)}</span>`;
    return pagina('Orçado x realizado', `De ${fmes(r.de)} a ${fmes(r.ate)}. Desvios acima de ${num(r.tolerancia, 1)}% ficam destacados: favorável (receita acima ou despesa abaixo do orçado) ou desfavorável.`, '',
      html`${filtros(campos, f)}
      <div class="grid g4" style="margin-bottom:14px">${kpi('Resultado orçado', brl(r.resultado.orcado))}${kpi('Resultado realizado', brl(r.resultado.realizado), '', colorVal(r.resultado.realizado))}${kpi('Desvio do resultado', brl(r.resultado.desvio), r.resultado.desvio_pct == null ? '' : pct(r.resultado.desvio_pct), r.resultado.situacao === 'favoravel' ? 'pos' : r.resultado.situacao === 'desfavoravel' ? 'neg' : '')}</div>
      <div class="card"><h2>Resumo por categoria</h2>${tbl([{ h: 'Categoria', f: x => x.rotulo }, { h: 'Orçado', c: 'num', f: x => brl(x.orcado) }, { h: 'Realizado', c: 'num', f: x => brl(x.realizado) }, { h: 'Desvio', c: 'num', f: dv }, { h: 'Desvio %', c: 'num', f: x => x.desvio_pct == null ? '—' : pct(x.desvio_pct) }, { h: 'Situação', f: x => sitPill(x.situacao) }], r.resumo, { empty: 'Sem orçamento nem movimento no período.', rowCls: x => x.situacao === 'desfavoravel' ? 'bad' : '' })}</div>
      <div class="card"><h2>Por conta</h2>${tbl([{ h: 'Conta', f: x => `${x.codigo} ${x.nome}` }, { h: 'Categoria', f: x => CATS[x.categoria]?.replace('Orçamento de ', '') || x.categoria }, { h: 'Orçado', c: 'num', f: x => brl(x.orcado) }, { h: 'Realizado', c: 'num', f: x => brl(x.realizado) }, { h: 'Desvio', c: 'num', f: dv }, { h: 'Desvio %', c: 'num', f: x => x.desvio_pct == null ? '—' : pct(x.desvio_pct) }, { h: 'Situação', f: x => sitPill(x.situacao) }, { h: '', f: x => btn('or-mes', x.conta_id, 'Meses') }], r.linhas, { empty: 'Nada a comparar. Monte o orçamento e registre lançamentos.', rowCls: x => x.situacao === 'desfavoravel' ? 'bad' : '' })}</div>`);
  }
});
ACOES['or-mes'] = d => {
  const l = E.orcrel.linhas.find(x => String(x.conta_id) === d.id);
  modal({
    title: `${l.codigo} ${l.nome}`, wide: true, actions: [{ label: 'Fechar', cls: 'pri', onClick: a => a.close() }],
    body: tbl([{ h: 'Mês', f: x => fmes(x.mes) }, { h: 'Orçado', c: 'num', f: x => brl(x.orcado) }, { h: 'Realizado', c: 'num', f: x => brl(x.realizado) }, { h: 'Desvio', c: 'num', f: x => brl(x.desvio) }, { h: '%', c: 'num', f: x => x.desvio_pct == null ? '—' : pct(x.desvio_pct) }, { h: 'Situação', f: x => sitPill(x.situacao) }], l.meses, { rowCls: x => x.situacao === 'desfavoravel' ? 'bad' : '' })
  });
};

// ───────── Crédito ─────────
const CS_DESC = [['carater', 'Caráter', 'Histórico e idoneidade do cliente no pagamento de compromissos'], ['capacidade', 'Capacidade', 'Capacidade de gerar caixa/resultado para pagar'], ['capital', 'Capital', 'Patrimônio e solidez financeira'],
['colateral', 'Colateral', 'Garantias oferecidas'], ['condicoes', 'Condições', 'Cenário econômico e do setor'], ['conglomerado', 'Conglomerado', 'Grupo econômico e relações com outras empresas']];
rota({
  id: 'credito', titulo: 'Análise de crédito', grupo: 'Crédito e cobrança', need: 'ver',
  async render() {
    const rows = await get('/api/credito/resumo'); E.cred = rows;
    return pagina('Análise de crédito', 'Os 5 C’s do crédito (mais o conglomerado) geram a nota média, o rating e o limite aprovado. Vendas que passam do limite são bloqueadas ou sinalizadas.', '',
      html`<div class="grid g4" style="margin-bottom:14px">${kpi('Clientes ativos', rows.length)}${kpi('Acima do limite', rows.filter(r => r.status === 'excedido' || r.status === 'bloqueado').length, '', 'neg')}${kpi('Sem análise', rows.filter(r => !r.ultima_analise).length, 'sem rating definido')}${kpi('Limite total concedido', brl(rows.reduce((a, r) => a + r.limite, 0)))}</div>
      <div class="card">${tbl([
        { h: 'Cliente', f: r => html`<strong>${r.nome}</strong>` }, { h: 'Rating', f: r => r.rating ? pill(r.rating) : html`<span class="mut">—</span>` }, { h: 'Limite', c: 'num', f: r => brl(r.limite) }, { h: 'Em aberto', c: 'num', f: r => brl(r.usado) }, { h: 'Disponível', c: 'num', f: r => html`<span class="${colorVal(r.disponivel)}">${brl(r.disponivel)}</span>` },
        { h: 'Uso do limite', f: r => r.uso_pct == null ? '—' : html`<div class="meter ${r.uso_pct > 100 ? 'bad' : r.uso_pct >= 80 ? 'warn' : ''}"><i style="width:${Math.min(100, r.uso_pct)}%"></i></div><small>${pct(r.uso_pct, 0)}</small>` },
        { h: 'Situação', f: r => pill(CRED_ST[r.status][0], CRED_ST[r.status][1]) }, { h: 'Última análise', f: r => fdata(r.ultima_analise) }, { h: 'Bloqueados', c: 'ctr', f: r => r.titulos_bloqueados || '' },
        { h: '', f: r => html`<div class="row">${pode('aprovar') ? btn('cr-analisar', r.id, 'Analisar', 'pri') : ''}${btn('cr-hist', r.id, 'Histórico')}</div>` }], rows, { empty: 'Nenhum cliente cadastrado. Cadastre clientes em “Clientes e fornecedores”.' })}</div>`);
  }
});
const NOTAS = [[1, '1 — Muito fraco'], [2, '2 — Fraco'], [3, '3 — Regular'], [4, '4 — Bom'], [5, '5 — Excelente']];
ACOES['cr-analisar'] = d => {
  const c = E.cred.find(x => String(x.id) === d.id);
  formModal({
    title: `Análise de crédito — ${c.nome}`, wide: true, submit: 'Registrar análise',
    intro: 'Dê notas de 1 a 5. Rating pela média: A ≥ 4,5 · B ≥ 3,5 · C ≥ 2,5 · D abaixo. O limite aprovado passa a valer imediatamente para novas vendas a prazo.',
    fields: [...CS_DESC.map(([n, l, h]) => ({ n, l, t: 'select', v: 3, opts: NOTAS, hint: h })),
    { n: 'decisao', l: 'Decisão', t: 'select', opts: [['aprovado', 'Aprovado'], ['condicionado', 'Aprovado com condições'], ['reprovado', 'Reprovado (limite zerado)']] }, { n: 'limite_aprovado', l: 'Limite aprovado (R$)', t: 'money', v: String(c.limite || ''), hint: 'Ignorado quando reprovado' },
    { n: 'parecer', l: 'Parecer do analista', t: 'area', full: 1 }],
    async onSubmit(v, a) {
      CS_DESC.forEach(([n]) => v[n] = Number(v[n])); if (v.decisao === 'reprovado') v.limite_aprovado = '0';
      const r = await post('/api/analises-credito', { ...v, parceiro_id: Number(d.id) }); a.close(); toast(`Análise registrada: média ${num(r.media)} · rating ${r.rating}.`); recarregar();
    }
  });
};
ACOES['cr-hist'] = async d => {
  const rows = await get('/api/analises-credito', { parceiro_id: d.id });
  modal({
    title: 'Histórico de análises', wide: true, actions: [{ label: 'Fechar', cls: 'pri', onClick: a => a.close() }],
    body: tbl([{ h: 'Data', f: r => fdata(r.data) }, ...CS_DESC.map(([n, l]) => ({ h: l.slice(0, 4) + '.', c: 'ctr', f: r => r[n] })), { h: 'Média', c: 'num', f: r => num(r.media) }, { h: 'Rating', f: r => pill(r.rating) }, { h: 'Decisão', f: r => pill(r.decisao, r.decisao) }, { h: 'Limite', c: 'num', f: r => brl(r.limite_aprovado) }, { h: 'Analista', f: r => r.analista || '—' }, { h: 'Parecer', f: r => r.parecer || '' }], rows, { empty: 'Nenhuma análise registrada para este cliente.' })
  });
};

// ───────── Cobrança ─────────
const FAIXA_ROT = { a_vencer: 'A vencer', '1-30': '1 a 30 dias', '31-60': '31 a 60 dias', '61-90': '61 a 90 dias', '>90': 'Mais de 90 dias' };
const ACAO_TIPO = [['ligacao', 'Ligação'], ['email', 'E-mail'], ['whatsapp', 'WhatsApp'], ['carta', 'Carta de cobrança'], ['visita', 'Visita'], ['negociacao', 'Negociação / acordo'], ['protesto', 'Protesto']];
rota({
  id: 'cobranca', titulo: 'Cobrança', grupo: 'Crédito e cobrança', need: 'ver',
  async render() {
    const r = await get('/api/cobranca'); E.cob = r; const max = Math.max(1, ...r.resumo.map(x => x.valor));
    return pagina('Carteira de cobrança', 'Títulos a receber em atraso, aging da carteira e registro das ações de cobrança.', '',
      html`<div class="grid g4" style="margin-bottom:14px">${kpi('Carteira a receber', brl(r.total_carteira))}${kpi('Em atraso', brl(r.total_atraso), '', r.total_atraso ? 'neg' : '')}${kpi('Inadimplência', pct(r.inadimplencia_pct), 'atraso ÷ carteira', r.inadimplencia_pct > 10 ? 'neg' : r.inadimplencia_pct > 5 ? 'warn' : '')}</div>
      <div class="grid g2"><div class="card"><h2>Aging da carteira</h2>${tbl([{ h: 'Faixa', f: x => FAIXA_ROT[x.faixa] }, { h: 'Títulos', c: 'num', f: x => x.qtd }, { h: 'Valor', c: 'num', f: x => brl(x.valor) }, { h: '', f: x => html`<div class="meter ${x.faixa === 'a_vencer' ? '' : 'bad'}"><i style="width:${Math.round(x.valor / max * 100)}%"></i></div>` }], r.resumo)}</div>
      <div class="card"><h2>Devedores</h2>${tbl([{ h: 'Cliente', f: x => x.nome }, { h: 'Títulos', c: 'num', f: x => x.qtd }, { h: 'Maior atraso', c: 'num', f: x => x.max_dias + ' dias' }, { h: 'Valor', c: 'num', f: x => brl(x.valor) }], r.por_cliente, { empty: 'Nenhum cliente em atraso. 🎉'.replace(' 🎉', '') })}</div></div>
      <div class="card"><h2>Títulos em atraso</h2>${tbl([{ h: '#', f: x => x.id }, { h: 'Cliente', f: x => html`${x.parceiro_nome}<div class="mut">${x.telefone || ''} ${x.email || ''}</div>` }, { h: 'Vencimento', f: x => fdata(x.vencimento) }, { h: 'Atraso', c: 'num', f: x => html`<span class="neg">${x.dias_atraso} dias</span>` }, { h: 'Faixa', f: x => FAIXA_ROT[x.faixa] }, { h: 'Valor', c: 'num', f: x => brl(x.valor_r) },
        { h: 'Última ação', f: x => x.ultima_acao_tipo ? html`${ACAO_TIPO.find(a => a[0] === x.ultima_acao_tipo)?.[1]} em ${fdata(x.ultima_acao_data)}${x.promessa_data ? html`<div class="mut">Promessa: ${fdata(x.promessa_data)}</div>` : ''}` : html`<span class="mut">nenhuma</span>` },
        { h: '', f: x => html`<div class="row">${pode('lancar') ? btn('cb-acao', x.id, 'Registrar ação', 'pri') : ''}${btn('cb-hist', x.id, 'Histórico (' + x.n_acoes + ')')}</div>` }], r.titulos, { empty: 'Nenhum título em atraso.' })}</div>`);
  }
});
ACOES['cb-acao'] = d => {
  const t = E.cob.titulos.find(x => String(x.id) === d.id);
  formModal({
    title: `Ação de cobrança — título #${t.id}`, intro: `${t.parceiro_nome} · ${brl(t.valor_r)} · ${t.dias_atraso} dias de atraso`, submit: 'Registrar ação',
    fields: [{ n: 'tipo', l: 'Tipo de ação', t: 'select', opts: ACAO_TIPO }, { n: 'data', l: 'Data', t: 'date', v: hojeISO() }, { n: 'promessa_data', l: 'Promessa de pagamento (opcional)', t: 'date' }, { n: 'descricao', l: 'Resultado / descrição', t: 'area', req: 1, full: 1 }],
    async onSubmit(v, a) { await post('/api/cobranca/acoes', { ...v, titulo_id: Number(d.id) }); a.close(); toast('Ação registrada.'); recarregar(); }
  });
};
ACOES['cb-hist'] = async d => {
  const rows = await get('/api/cobranca/acoes', { titulo_id: d.id });
  modal({ title: `Histórico de cobrança — título #${d.id}`, wide: true, actions: [{ label: 'Fechar', cls: 'pri', onClick: a => a.close() }], body: tbl([{ h: 'Data', f: r => fdata(r.data) }, { h: 'Ação', f: r => ACAO_TIPO.find(a => a[0] === r.tipo)?.[1] }, { h: 'Descrição', f: r => r.descricao }, { h: 'Promessa', f: r => fdata(r.promessa_data) }, { h: 'Por', f: r => r.usuario || '—' }], rows, { empty: 'Nenhuma ação registrada ainda.' }) });
};

// ───────── Investimentos ─────────
const TIPO_INV = [['CDB', 'CDB'], ['LCI', 'LCI'], ['LCA', 'LCA'], ['TESOURO', 'Tesouro Direto'], ['PGBL', 'Previdência PGBL'], ['VGBL', 'Previdência VGBL']];
rota({
  id: 'investimentos', titulo: 'Investimentos', grupo: 'Investimentos e custos', need: 'ver',
  async render() {
    const [s, rows] = await Promise.all([get('/api/investimentos/resumo'), get('/api/aplicacoes')]); E.apl = rows;
    return pagina('Aplicações financeiras', 'Carteira de CDB, LCI, LCA, Tesouro Direto e previdência (PGBL/VGBL), com retorno médio e ponderado e valor a receber por vencimento.',
      pode('lancar') ? html`<button class="btn pri" data-a="ap-nova">+ Nova aplicação</button>` : '',
      html`<div class="grid g4" style="margin-bottom:14px">${kpi('Principal aplicado', brl(s.total_aplicado), s.qtd + ' aplicação(ões) ativa(s)')}${kpi('Valor atual estimado', brl(s.valor_atual), 'juros compostos pela taxa a.a.')}${kpi('Rendimento acumulado', brl(s.rendimento_acumulado), '', colorVal(s.rendimento_acumulado))}
      ${kpi('Retorno médio (simples)', s.retorno_medio_simples == null ? '—' : pct(s.retorno_medio_simples, 2) + ' a.a.', 'média das taxas')}${kpi('Retorno ponderado', s.retorno_ponderado == null ? '—' : pct(s.retorno_ponderado, 2) + ' a.a.', 'ponderado pelo principal')}${kpi('A receber nos vencimentos', brl(s.total_a_receber_no_vencimento), 'principal + rendimento até o vencimento')}</div>
      <div class="grid g2"><div class="card"><h2>Por tipo</h2>${tbl([{ h: 'Tipo', f: x => x.nome }, { h: 'Aplicado', c: 'num', f: x => brl(x.aplicado) }, { h: 'Valor atual', c: 'num', f: x => brl(x.valor_atual) }, { h: 'Taxa pond.', c: 'num', f: x => x.taxa_ponderada == null ? '—' : pct(x.taxa_ponderada, 2) }], s.por_tipo, { empty: 'Sem aplicações ativas.' })}</div>
      <div class="card"><h2>Saldo a receber por vencimento</h2>${tbl([{ h: 'Mês', f: x => ({ vencidas: 'Vencidas (a resgatar)', sem_vencimento: 'Sem vencimento definido' })[x.periodo] || fmes(x.periodo) }, { h: 'Principal', c: 'num', f: x => brl(x.principal) }, { h: 'No vencimento', c: 'num', f: x => brl(x.valor_vencimento) }, { h: 'Qtd', c: 'num', f: x => x.qtd }], s.a_receber_por_vencimento, { empty: 'Sem aplicações ativas.' })}
      ${tbl([{ h: 'Faixa de prazo', f: x => x.faixa }, { h: 'A receber', c: 'num', f: x => brl(x.valor) }], s.a_receber_por_faixa.filter(x => x.valor))}</div></div>
      <div class="card"><h2>Aplicações</h2>${tbl([{ h: 'Aplicação', f: x => html`<strong>${x.tipo_nome}</strong> · ${x.instituicao}<div class="mut">${x.descricao || ''}</div>` }, { h: 'Data', f: x => fdata(x.data_aplicacao) }, { h: 'Vencimento', f: x => x.vencimento ? html`${fdata(x.vencimento)}<div class="mut">${x.status === 'ativa' ? (x.dias_ate_vencimento < 0 ? 'vencida' : x.dias_ate_vencimento + ' dias') : ''}</div>` : '—' },
        { h: 'Taxa a.a.', c: 'num', f: x => pct(x.taxa_aa, 2) }, { h: 'Aplicado', c: 'num', f: x => brl(x.valor_r) }, { h: 'Principal restante', c: 'num', f: x => brl(x.principal_restante) }, { h: 'Valor atual', c: 'num', f: x => x.status === 'ativa' ? brl(x.valor_atual) : '—' }, { h: 'No vencimento', c: 'num', f: x => x.valor_vencimento == null ? '—' : brl(x.valor_vencimento) },
        { h: 'Situação', f: x => pill(x.status === 'ativa' ? 'Ativa' : 'Resgatada', x.status === 'ativa' ? 'ativa' : 'cancelado') }, { h: '', f: x => html`<div class="row">${x.status === 'ativa' && pode('lancar') ? btn('ap-resgate', x.id, 'Resgatar', 'pri') : ''}${btn('ap-resgates', x.id, 'Resgates')}</div>` }], rows, { empty: 'Nenhuma aplicação registrada.' })}</div>`);
  }
});
ACOES['ap-nova'] = async () => {
  const [opConta, cfs] = await Promise.all([contasOpcoes(c => c.tipo === 'ativo'), get('/api/contas-fin')]);
  const cf = cfs.filter(c => c.ativa); if (!cf.length) throw new Error('Cadastre um caixa/banco para debitar o valor aplicado.');
  formModal({
    title: 'Nova aplicação financeira', wide: true, submit: 'Registrar aplicação',
    intro: 'O valor sai do caixa/banco escolhido e é lançado contabilmente: débito na conta de aplicações e crédito no caixa/banco.',
    fields: [{ n: 'tipo', l: 'Tipo', t: 'select', opts: TIPO_INV }, { n: 'instituicao', l: 'Instituição', req: 1 }, { n: 'descricao', l: 'Descrição (indexador, nome do título)', full: 1 },
    { n: 'data_aplicacao', l: 'Data da aplicação', t: 'date', v: hojeISO(), req: 1 }, { n: 'vencimento', l: 'Vencimento', t: 'date', hint: 'Opcional apenas para previdência' }, { n: 'valor', l: 'Valor aplicado (R$)', t: 'money', req: 1 }, { n: 'taxa_aa', l: 'Taxa (% ao ano)', t: 'number', req: 1 },
    { n: 'conta_id', l: 'Conta contábil da aplicação (Ativo)', t: 'select', opts: opConta, req: 1, hint: 'Ex.: 1.1.2 Aplicações Financeiras' }, { n: 'conta_fin_id', l: 'Caixa/banco de origem', t: 'select', opts: cf.map(c => [c.id, `${c.nome} (saldo ${brl(c.saldo)})`]) }],
    async onSubmit(v, a) { await post('/api/aplicacoes', v); a.close(); toast('Aplicação registrada.'); recarregar(); }
  });
};
ACOES['ap-resgate'] = async d => {
  const x = E.apl.find(y => String(y.id) === d.id);
  const [opRec, cfs] = await Promise.all([contasOpcoes(c => c.tipo === 'receita', '(sem rendimento)'), get('/api/contas-fin')]);
  formModal({
    title: `Resgatar ${x.tipo_nome} — ${x.instituicao}`, submit: 'Confirmar resgate',
    intro: `Principal restante ${brl(x.principal_restante)} · valor atual estimado ${brl(x.valor_atual)}. Informe o rendimento efetivamente recebido para lançar a receita financeira.`,
    fields: [{ n: 'data', l: 'Data do resgate', t: 'date', v: hojeISO() }, { n: 'conta_fin_id', l: 'Creditar em', t: 'select', opts: cfs.filter(c => c.ativa).map(c => [c.id, c.nome]) },
    { n: 'principal', l: 'Principal resgatado (R$)', t: 'money', v: String(x.principal_restante).replace('.', ','), req: 1 }, { n: 'rendimento', l: 'Rendimento (R$)', t: 'money', v: '0' },
    { n: 'conta_rendimento_id', l: 'Conta de receita financeira', t: 'select', opts: opRec, full: 1, hint: 'Obrigatória se houver rendimento (ex.: 4.2.1)' }],
    async onSubmit(v, a) { const b = { ...v }; if (!b.conta_rendimento_id) delete b.conta_rendimento_id; else b.conta_rendimento_id = Number(b.conta_rendimento_id); await post(`/api/aplicacoes/${d.id}/resgate`, b); a.close(); toast('Resgate registrado.'); recarregar(); }
  });
};
ACOES['ap-resgates'] = async d => {
  const rows = await get(`/api/aplicacoes/${d.id}/resgates`);
  modal({ title: 'Resgates da aplicação #' + d.id, actions: [{ label: 'Fechar', cls: 'pri', onClick: a => a.close() }], body: tbl([{ h: 'Data', f: r => fdata(r.data) }, { h: 'Principal', c: 'num', f: r => brl(r.principal) }, { h: 'Rendimento', c: 'num', f: r => brl(r.rendimento) }], rows, { empty: 'Nenhum resgate.' }) });
};

// ───────── Produtos e margem de contribuição ─────────
const CAMPOS_MC = [{ n: 'custos_fixos', l: 'Custos fixos mensais (R$)', t: 'money' }, { n: 'margem_alvo', l: 'Margem de contribuição alvo (%)', t: 'number', v: 30 }];
rota({
  id: 'produtos', titulo: 'Produtos e margem', grupo: 'Investimentos e custos', need: 'ver', campos: CAMPOS_MC,
  async render() {
    const f = filtroDe('produtos'); const [r, ps] = await Promise.all([get('/api/relatorios/margem', f), get('/api/produtos')]); E.prods = ps; const ed = pode('cadastro');
    const campos = CAMPOS_MC.map(c => c.n === 'custos_fixos' ? { ...c, ph: String(r.custos_fixos_sugeridos_dre).replace('.', ','), hint: 'Sugestão pela DRE (média mensal de custos indiretos + despesas, 90 dias): ' + brl(r.custos_fixos_sugeridos_dre) } : c);
    return pagina('Produtos e margem de contribuição', 'Margem de contribuição = preço − custo variável − despesas variáveis. Apoia a precificação e o cálculo do ponto de equilíbrio.',
      ed ? html`<button class="btn pri" data-a="pr-novo">+ Novo produto</button>` : '',
      html`${filtros(campos, f)}
      <div class="grid g4" style="margin-bottom:14px">${kpi('Receita mensal prevista', brl(r.receita_total))}${kpi('Margem de contribuição total', brl(r.mc_total), r.mc_pct_ponderada == null ? '' : pct(r.mc_pct_ponderada) + ' da receita')}${kpi('Resultado projetado', brl(r.resultado_projetado), 'MC − custos fixos de ' + brl(r.custos_fixos), colorVal(r.resultado_projetado))}
      ${kpi('Ponto de equilíbrio', r.ponto_equilibrio_valor == null ? '—' : brl(r.ponto_equilibrio_valor), r.ponto_equilibrio_unidades == null ? 'informe os custos fixos' : num(r.ponto_equilibrio_unidades, 1) + ' unidades/mês')}${kpi('Margem de segurança', r.margem_seguranca_pct == null ? '—' : pct(r.margem_seguranca_pct), 'quanto a receita pode cair', r.margem_seguranca_pct != null && r.margem_seguranca_pct < 0 ? 'neg' : '')}</div>
      <div class="card"><h2>Margem por produto</h2>${tbl([{ h: 'Produto', f: x => html`<strong>${x.nome}</strong><div class="mut">${x.codigo || ''}</div>` }, { h: 'Preço', c: 'num', f: x => brl(x.preco) }, { h: 'Custo variável', c: 'num', f: x => brl(x.custo_variavel) }, { h: 'Desp. variáveis', c: 'num', f: x => brl(x.desp_variaveis) },
        { h: 'MC unitária', c: 'num', f: x => html`<span class="${colorVal(x.mc_unit)}">${brl(x.mc_unit)}</span>` }, { h: 'MC %', c: 'num', f: x => pct(x.mc_pct) }, { h: 'Qtd/mês', c: 'num', f: x => num(x.quantidade, 0) }, { h: 'MC total', c: 'num', f: x => brl(x.mc_total) },
        { h: `Preço p/ ${num(r.margem_alvo, 0)}%`, c: 'num', f: x => x.preco_sugerido == null ? '—' : brl(x.preco_sugerido) }, { h: 'Alerta', f: x => x.alerta ? html`<span class="pill ${x.mc_unit < 0 ? 'bloqueado' : 'alerta'}">${x.alerta}</span>` : '' }, ...(ed ? [{ h: '', f: x => btn('pr-edit', x.id, 'Editar') }] : [])], r.itens, { empty: 'Nenhum produto ativo. Cadastre produtos com preço e custo variável.', rowCls: x => x.mc_unit < 0 ? 'bad' : '' })}</div>`);
  }
});
function formProduto(p) {
  formModal({
    title: p ? 'Editar produto' : 'Novo produto', wide: true, submit: 'Salvar',
    fields: [{ n: 'codigo', l: 'Código', v: p?.codigo }, { n: 'nome', l: 'Nome', req: 1, v: p?.nome }, { n: 'preco', l: 'Preço de venda (R$)', t: 'money', req: 1, v: p ? String(p.preco_r).replace('.', ',') : '' },
    { n: 'custo_variavel', l: 'Custo variável unitário (R$)', t: 'money', req: 1, v: p ? String(p.custo_variavel_r).replace('.', ',') : '', hint: 'Matéria-prima, mercadoria, embalagem, comissão fixa por unidade…' },
    { n: 'desp_var_pct', l: 'Despesas variáveis (% do preço)', t: 'number', v: p?.desp_var_pct ?? 0, hint: 'Tributos sobre vendas, comissões, taxas de cartão' }, { n: 'quantidade_mensal', l: 'Quantidade vendida por mês', t: 'number', v: p?.quantidade_mensal ?? 0 },
    { n: 'ativo', l: 'Produto ativo', t: 'check', v: p ? p.ativo : 1, full: 1 }],
    extra: html`<div class="full eqn" id="mcprev">Margem de contribuição: preencha preço e custo.</div>`,
    onOpen(ov) {
      const calc = () => {
        const g = n => parseMoney($(`[name=${n}]`, ov).value) || 0; const pr = g('preco'), cv = g('custo_variavel'), dv = pr * g('desp_var_pct') / 100, mc = pr - cv - dv;
        $('#mcprev', ov).innerHTML = pr ? `MC unitária = ${brl(pr)} − ${brl(cv)} − ${brl(dv)} = <strong class="${mc < 0 ? 'neg' : 'pos'}">${brl(mc)}</strong> (${num(mc / pr * 100, 1)}% do preço)` : 'Margem de contribuição: preencha preço e custo.';
      };
      ov.addEventListener('input', calc); calc();
    },
    async onSubmit(v, a) { p ? await put('/api/produtos/' + p.id, v) : await post('/api/produtos', v); a.close(); toast('Produto salvo.'); recarregar(); }
  });
}
ACOES['pr-novo'] = () => formProduto(null);
ACOES['pr-edit'] = d => formProduto(E.prods.find(x => String(x.id) === d.id));

</script>
<script>
// ───────── Camada local: a interface conversa com o motor embutido (sem servidor) ─────────
async function api(method, path, { body, q } = {}) {
  const query = {}; if (q) Object.entries(q).forEach(([k, v]) => { if (v !== '' && v != null) query[k] = String(v); });
  const emp = (E.me && E.me.usuario.papel === 'master' && E.empId) ? E.empId : null;
  try { return await Engine.handle(method, path, query, body || {}, emp); }
  catch (e) {
    if (e.status === 401 && E.me && path !== '/api/login') { E.me = null; telaLogin('Sua sessão expirou. Entre novamente.'); }
    else if (e.data && e.data.trocar_senha && E.me) { E.me.usuario.trocar_senha = true; telaTrocaSenha(); }
    throw e;
  }
}

function telaLogin(msg, precisaSetup) {
  const setup = !!precisaSetup;
  const seguro = window.crypto && window.crypto.subtle;
  mount($('#app'), html`<div class="login"><form class="card box" id="lf" novalidate>
    <h1>ERP Financeiro</h1><p class="mut" style="margin:4px 0 14px">${setup ? 'Primeiro acesso: crie a conta do master (administrador da plataforma).' : 'Gestão financeira empresarial: contabilidade, caixa, orçamento, crédito, investimentos e custos.'}</p>
    ${msg ? nota(msg, 'warn') : ''}${seguro ? '' : nota('Este navegador bloqueou a criptografia (abra por https:// ou localhost).', 'warn')}<div class="err" id="lerr" hidden></div>
    ${setup ? html`<div class="field">${campo({ n: 'nome', l: 'Seu nome' })}</div><div style="height:10px"></div>` : ''}
    <div class="field">${campo({ n: 'login', l: 'Login', req: 1 })}</div><div style="height:10px"></div>
    <div class="field"><label for="f_senha">Senha ${setup ? '(mín. 6 caracteres) ' : ''}*</label><input id="f_senha" name="senha" type="password" autocomplete="${setup ? 'new-password' : 'current-password'}"></div>
    <div style="height:14px"></div><button class="btn pri" style="width:100%;justify-content:center" type="submit">${setup ? 'Criar master e entrar' : 'Entrar'}</button>
    <p class="hint" style="margin-top:12px">${setup ? 'Guarde esta senha: ela controla todas as empresas.' : 'Os acessos são criados pelo master, que repassa login e senha à empresa.'}</p></form></div>`);
  $('#lf').addEventListener('submit', async e => {
    e.preventDefault(); const er = $('#lerr'); er.hidden = true;
    try {
      const login = $('#f_login').value.trim(), senha = $('#f_senha').value;
      if (setup) await post('/api/setup', { login, senha, nome: $('#f_nome').value.trim() });
      E.me = await post('/api/login', { login, senha });
      await iniciarSessao();
    } catch (x) { er.textContent = x.message; er.hidden = false; }
  });
  (setup ? $('#f_nome') : $('#f_login')).focus();
}

function baixarArquivo(nome, texto, tipo) {
  const url = URL.createObjectURL(new Blob([texto], { type: tipo || 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}

rota({
  id: 'backup', titulo: 'Backup e restauração', grupo: 'Administração', master: true,
  async render() {
    return pagina('Backup e restauração', 'Os dados ficam salvos neste navegador. Faça backup com frequência.', '', html`
      ${nota('Os dados desta instalação existem apenas neste navegador/dispositivo. Limpar os dados do navegador apaga tudo — baixe o backup e guarde em local seguro.', 'warn')}
      <div class="card box"><h3>Baixar backup</h3><p class="mut">Gera um arquivo .json com todas as empresas, usuários e lançamentos.</p><button class="btn pri" data-a="bk-baixar">Baixar backup agora</button></div>
      <div style="height:12px"></div>
      <div class="card box"><h3>Restaurar backup</h3><p class="mut">Substitui TODOS os dados atuais pelos do arquivo escolhido.</p><input type="file" id="bk-file" accept=".json,application/json"> <button class="btn" data-a="bk-restaurar">Restaurar</button></div>
      <div style="height:12px"></div>
      <div class="card box"><h3>Apagar tudo</h3><p class="mut">Remove todos os dados deste navegador, inclusive o master.</p><button class="btn dng" data-a="bk-zerar">Apagar todos os dados</button></div>`);
  }
});
ACOES['bk-baixar'] = () => { baixarArquivo('erp-backup-' + new Date().toISOString().slice(0, 10) + '.json', Engine.exportar()); toast('Backup gerado.'); };
ACOES['bk-restaurar'] = async () => {
  const f = $('#bk-file').files[0]; if (!f) { toast('Escolha o arquivo de backup.', true); return; }
  if (!await confirmar('Substituir todos os dados atuais pelo backup? Isso não pode ser desfeito.', 'Restaurar')) return;
  try { Engine.importar(await f.text()); } catch (e) { toast(e.message, true); return; }
  Engine.setToken(null); E.me = null; telaLogin('Backup restaurado. Entre novamente.');
};
ACOES['bk-zerar'] = async () => {
  if (!await confirmar('Apagar TODOS os dados deste navegador? Baixe um backup antes.', 'Apagar tudo')) return;
  Engine.zerar(); E.me = null; E.empId = null; boot();
};

async function boot() {
  try {
    const s = await get('/api/setup'); if (s.precisa) { telaLogin('', true); return; }
    E.me = await get('/api/me'); await iniciarSessao();
  } catch (e) { if (!E.me) telaLogin(e.status === 401 ? '' : e.message); }
}

</script>
<script>
'use strict';
boot();

</script>
